<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMWC Wargame System</title>

<style>
/* === YOUR ORIGINAL FULL CSS (unchanged) === */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Courier New',Courier,monospace}

:root{
  --mil-green:#3B4A2F;
  --mil-green-mid:#4E6238;
  --mil-green-light:#7A8F64;
  --mil-tan:#C8B89A;
  --mil-tan-light:#E8DCC8;
  --mil-surface:#E8DCC8;
  --mil-border:#9E8B72;
  --mil-border-light:#BFB09A;
  --mil-text:#1E2516;
  --mil-text-muted:#6B7A5A;
  --mil-blue:#1A3A5C;
  --mil-blue-light:#2E5F8A;
  --mil-blue-bg:#D6E4F0;
  --mil-blue-surface:#C0D8EE;
  --mil-blue-border:#7AAACE;
  --mil-red:#6B1A1A;
  --mil-red-light:#9E2B2B;
  --mil-red-bg:#F0D6D6;
  --mil-red-surface:#E8C4C4;
  --mil-red-border:#C47A7A;
  --mil-gold:#7A6A2A;
  --mil-gold-bg:#F0EAC8;
  --mil-ok-bg:#DFF0D8;--mil-ok-text:#2A4A1A;--mil-ok-border:#8A9E72;
  --mil-warn-bg:#F0EAC8;--mil-warn-text:#7A6A2A;--mil-warn-border:#C8B84A;
}

body.role-director{
  --page-bg:#1A1E16;
  --page-surface:#22271C;
  --page-surface2:#2C3224;
  --page-border:#3E4A32;
  --page-border-light:#4E5E3E;
  --page-text:#D8DDD0;
  --page-text-muted:#8A9A7A;
  --page-accent:var(--mil-green-light);
  --input-bg:#181C14;
  --input-border:#3E4A32;
  --btn-surface:#2C3224;
  --btn-hover:#3B4A2F;
  background:var(--page-bg);
  color:var(--page-text);
}

body.role-blue{
  --page-bg:#111820;
  --page-surface:#17222E;
  --page-surface2:#1E2E3E;
  --page-border:#2A4A6A;
  --page-border-light:#3A5A7A;
  --page-text:#C8D8E8;
  --page-text-muted:#6A8AAA;
  --page-accent:#4A8AC0;
  --input-bg:#111820;
  --input-border:#2A4A6A;
  --btn-surface:#1E2E3E;
  --btn-hover:#2A3E52;
  background:var(--page-bg);
  color:var(--page-text);
}

body.role-red{
  --page-bg:#1A1010;
  --page-surface:#221717;
  --page-surface2:#2E1E1E;
  --page-border:#5A2A2A;
  --page-border-light:#6A3A3A;
  --page-text:#E8C8C8;
  --page-text-muted:#AA6A6A;
  --page-accent:#C04A4A;
  --input-bg:#1A1010;
  --input-border:#5A2A2A;
  --btn-surface:#2E1E1E;
  --btn-hover:#3E2A2A;
  background:var(--page-bg);
  color:var(--page-text);
}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 3rem}

.top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:2px solid var(--page-accent,var(--mil-green))}
.top-left{display:flex;flex-direction:column;gap:8px}
.top-title{font-size:17px;font-weight:700;color:var(--page-text);letter-spacing:0.1em;text-transform:uppercase}
.role-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid}
.role-badge.dir{background:var(--page-surface2);color:var(--mil-green-light);border-color:var(--mil-green-light)}
.role-badge.blue{background:rgba(74,138,192,0.2);color:#4A8AC0;border-color:#4A8AC0}
.role-badge.red{background:rgba(192,74,74,0.2);color:#C04A4A;border-color:#C04A4A}

.clocks{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.clock-block{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;background:var(--page-surface2);border-radius:3px;border:1px solid var(--page-border)}
.clock-label{font-size:10px;color:var(--page-text-muted);letter-spacing:0.07em;text-transform:uppercase;font-weight:500}
.clock-value{font-size:15px;font-weight:700;color:var(--page-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-value.game{color:var(--page-accent)}
.clock-with-btn{display:flex;align-items:flex-start;gap:6px}
.timer-btns{display:flex;flex-direction:column;gap:3px}
.game-clock-controls{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.gclock-row{display:flex;align-items:center;gap:6px}
.gclock-row label{font-size:11px;color:var(--page-text-muted);white-space:nowrap;font-weight:500;letter-spacing:0.03em}
.gclock-row input,.gclock-row select{font-size:12px;border:1px solid var(--page-border);border-radius:3px;padding:4px 8px;background:var(--input-bg);color:var(--page-text);font-family:inherit}
.gclock-row input:focus,.gclock-row select:focus{outline:2px solid var(--page-accent);outline-offset:1px}
.team-clocks-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.turn-controls{display:flex;align-items:center;gap:8px}
.tc-label{font-size:11px;color:var(--page-text-muted);font-weight:500;letter-spacing:0.05em;text-transform:uppercase}
.tc-btn{font-size:12px;padding:4px 10px;border:1px solid var(--page-border);border-radius:3px;background:var(--btn-surface);color:var(--page-text);cursor:pointer;font-weight:500;font-family:inherit}
.tc-btn:hover{background:var(--btn-hover);border-color:var(--page-accent)}
.tc-val{font-size:14px;font-weight:700;min-width:20px;text-align:center;color:var(--page-text)}

.team-tabs{display:flex;gap:0;margin-bottom:1rem;border:1px solid var(--page-border);border-radius:3px;overflow:hidden}
.tab{flex:1;padding:9px 0;font-size:12px;font-weight:700;text-align:center;cursor:pointer;background:var(--btn-surface);color:var(--page-text-muted);border:none;border-right:1px solid var(--page-border);letter-spacing:0.06em;text-transform:uppercase;font-family:inherit;transition:background 0.15s}
.tab:last-child{border-right:none}
.tab:hover{background:var(--btn-hover)}
.tab.active{color:var(--page-text);background:var(--page-surface2);border-bottom:2px solid var(--page-accent)}
.tab .sub-badge{font-size:10px;margin-left:6px;padding:2px 7px;border-radius:2px;font-weight:500;font-family:inherit}

.panel{display:none}
.panel.active{display:block}

.section,.phase-section{background:var(--page-surface);border:1px solid var(--page-border);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.section-header,.phase-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--page-surface2);border-bottom:1px solid var(--page-border)}
.section-title,.phase-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--page-text)}
.section-tag{font-size:11px;color:var(--page-text-muted)}
.phase-toggle{font-size:11px;color:var(--page-text-muted);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;letter-spacing:0.03em;font-family:inherit}
.section-body,.phase-body{padding:14px}

.submission-block{background:var(--page-bg,#111);border:1px solid var(--page-border-light,var(--page-border));border-radius:3px;padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--page-accent)}
.sub-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:8px;font-size:12px;margin-bottom:4px;color:var(--page-text)}
.sub-row:last-child{margin-bottom:0}
.sub-row span:first-child{font-weight:700}
.no-submission{font-size:12px;color:var(--page-text-muted);font-style:italic;padding:4px 0}

.feedback-block{background:var(--page-surface2);border:1px solid var(--page-border);border-radius:3px;padding:12px 14px;margin-bottom:10px;line-height:1.6;font-size:13px;color:var(--page-text)}
.feedback-block.empty{color:var(--page-text-muted);font-style:italic}
.feedback-label{font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--page-text-muted);margin-bottom:6px}

/* ── INJECT STYLING ───────────────────────────────────────── */
/* Director view: inline inject card in adj panels */
.director-note{background:rgba(122,106,42,0.15);border:1px solid #C8B84A;border-left:3px solid var(--mil-gold);border-radius:3px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--page-text);line-height:1.6}
.director-note-label{font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--mil-gold);margin-bottom:5px}

/* Standalone inject entry — history and team feedback */
.inject-entry{background:rgba(122,106,42,0.12);border:1px solid #C8B84A;border-left:4px solid var(--mil-gold);border-radius:3px;padding:12px 14px;margin-bottom:10px}
.inject-entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.inject-entry-label{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--mil-gold)}
.inject-entry-meta{font-size:10px;color:var(--page-text-muted);letter-spacing:0.03em}
.inject-entry-note{font-size:13px;color:var(--page-text);line-height:1.6;margin-bottom:6px}
.inject-entry-struct{font-size:12px;color:var(--page-text-muted);line-height:1.5;padding-top:6px;border-top:1px solid rgba(200,184,74,0.25);margin-top:6px}
.inject-entry-struct-label{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mil-gold);opacity:0.75;margin-bottom:3px}

/* History inject separator */
.history-inject-wrap{margin-bottom:10px}
.history-inject-wrap .inject-entry{margin-bottom:0}

/* Team feedback inject section */
.inject-feed-section{background:var(--page-surface);border:1px solid #C8B84A;border-radius:3px;margin-bottom:1rem;overflow:hidden}
.inject-feed-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(122,106,42,0.18);border-bottom:1px solid #C8B84A}
.inject-feed-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#C8B84A}
.inject-feed-body{padding:14px}
.inject-feed-empty{font-size:12px;color:var(--page-text-muted);font-style:italic}

/* History inject pill in turn header */
.inject-pill{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:rgba(122,106,42,0.25);color:#C8B84A;border:1px solid rgba(200,184,74,0.4);margin-left:8px}
/* ─────────────────────────────────────────────────────────── */

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.adj-label{font-size:10px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px;display:block}
.field input,.field select,.field textarea,
.adj-input,.meta-input,.meta-select{font-size:13px;border:1px solid var(--input-border);border-radius:3px;padding:7px 10px;background:var(--input-bg);color:var(--page-text);width:100%;font-family:inherit}
.field textarea,.adj-input{resize:vertical;min-height:56px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,
.adj-input:focus,.meta-input:focus,.meta-select:focus{outline:2px solid var(--page-accent);outline-offset:1px;border-color:var(--page-accent)}
.auto-pop{color:var(--page-text-muted) !important;background:var(--page-surface2) !important}
.adj-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.entry-row{display:grid;gap:10px;margin-bottom:10px;align-items:start}
.entry-row.collections-row{grid-template-columns:1.2fr 1fr 1fr 2fr 28px}
.entry-row.maneuver-row{grid-template-columns:1fr 1fr 1.4fr 1.8fr 28px}
.entry-row.fires-row{grid-template-columns:1fr 1fr 1fr 1.4fr 1.2fr 28px}
.col-head{font-size:10px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding-bottom:4px}

.add-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--page-text-muted);background:none;border:1px dashed var(--page-border);border-radius:3px;padding:5px 12px;cursor:pointer;margin-top:4px;letter-spacing:0.03em;font-family:inherit}
.add-btn:hover{background:var(--btn-surface);color:var(--page-text)}
.remove-btn{width:26px;height:26px;border:1px solid var(--page-border);background:none;color:var(--page-text-muted);cursor:pointer;border-radius:3px;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:17px;font-family:inherit}
.remove-btn:hover{background:rgba(192,74,74,0.2);color:#C04A4A;border-color:#C04A4A}
.btn-secondary{font-size:12px;padding:7px 14px;border:1px solid var(--page-border);border-radius:3px;background:var(--btn-surface);color:var(--page-text-muted);cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;font-family:inherit}
.btn-secondary:hover{background:var(--btn-hover)}
.btn-primary{font-size:12px;padding:7px 16px;border:1px solid var(--page-accent);border-radius:3px;background:var(--page-accent);color:#fff;cursor:pointer;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-family:inherit}
.btn-primary:hover{opacity:0.88}
.btn-end{font-size:12px;padding:7px 16px;border:1px solid #C04A4A;border-radius:3px;background:none;color:#C04A4A;cursor:pointer;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-family:inherit}
.btn-end:hover{background:rgba(192,74,74,0.15)}
.btn-reset{font-size:12px;padding:7px 16px;border:1px solid var(--mil-gold);border-radius:3px;background:none;color:var(--mil-gold);cursor:pointer;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-family:inherit}
.btn-reset:hover{background:rgba(122,106,42,0.15)}

.recv-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-radius:3px;margin-bottom:1rem;font-size:13px;border:1px solid}
.recv-bar.waiting{background:var(--page-surface2);border-color:var(--page-border);color:var(--page-text-muted)}
.recv-bar.received{background:rgba(42,74,26,0.3);border-color:var(--mil-ok-border);color:#8ACA6A}
.recv-btn{font-size:12px;padding:5px 12px;border-radius:3px;border:1px solid var(--page-border);background:var(--btn-surface);color:var(--page-text);cursor:pointer;font-weight:700;letter-spacing:0.03em;font-family:inherit}
.recv-btn:hover{background:var(--btn-hover)}
.recv-btn.confirm{background:var(--mil-green-mid);color:#fff;border-color:var(--mil-green)}
.recv-btn.confirm:hover{background:var(--mil-green)}
.recv-btn:disabled{opacity:0.55;cursor:default}
.status-msg{font-size:12px;padding:5px 10px;border-radius:3px;margin-top:6px;display:none;border:1px solid}
.status-msg.visible{display:block}
.status-msg.ok{background:rgba(42,74,26,0.25);color:#8ACA6A;border-color:var(--mil-ok-border)}
.status-msg.warn{background:rgba(122,106,42,0.2);color:#C8B84A;border-color:#C8B84A}
.status-bar{font-size:12px;padding:5px 10px;border-radius:3px;border:1px solid;display:none;margin-right:auto}
.status-bar.visible{display:block}
.status-bar.ok{background:rgba(42,74,26,0.25);color:#8ACA6A;border-color:var(--mil-ok-border)}
.status-bar.warn{background:rgba(122,106,42,0.2);color:#C8B84A;border-color:#C8B84A}

.game-ended-banner{display:none;background:rgba(192,74,74,0.15);border:1px solid #C04A4A;border-radius:3px;padding:14px 18px;margin-bottom:1rem;text-align:center}
.game-ended-banner.visible{display:block}
.game-ended-banner .geb-title{font-size:15px;font-weight:700;color:#C04A4A;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.game-ended-banner .geb-sub{font-size:12px;color:var(--page-text-muted)}

.push-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--page-border)}
.next-time-block{flex:1}
.next-time-block label{font-size:10px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.next-time-block .nt-val{font-size:13px;font-weight:700;color:var(--page-accent);background:var(--page-bg);border:1px solid var(--page-border);border-radius:3px;padding:5px 10px;display:inline-block;min-width:130px}
.submit-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:1rem;border-top:1px solid var(--page-border)}

.history-turn{background:var(--page-surface);border:1px solid var(--page-border);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.history-turn-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--page-surface2);border-bottom:1px solid var(--page-border);cursor:pointer}
.history-turn-body{padding:14px;display:none}
.history-turn-body.open{display:block}
.history-team{margin-bottom:14px}
.history-team-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;padding:3px 8px;display:inline-block;border-radius:2px}
.history-team-label.blue{background:rgba(74,138,192,0.2);color:#4A8AC0}
.history-team-label.red{background:rgba(192,74,74,0.2);color:#C04A4A}
.history-entry{font-size:12px;color:var(--page-text);margin-bottom:3px;line-height:1.5}
.history-entry strong{color:var(--page-text-muted);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:0.05em;margin-right:6px}

/* Standalone inject block in history list */
.history-inject-block{background:rgba(122,106,42,0.12);border:1px solid #C8B84A;border-left:4px solid var(--mil-gold);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.history-inject-block-header{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:rgba(122,106,42,0.18);border-bottom:1px solid rgba(200,184,74,0.4);cursor:pointer}
.history-inject-block-body{padding:12px 14px;display:none}
.history-inject-block-body.open{display:block}

.end-block{margin-top:1rem;padding:1rem;background:var(--page-surface2);border-radius:3px;border:1px solid var(--page-border)}
.end-block-title{font-size:11px;font-weight:700;color:var(--page-text-muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:8px}
.end-block-desc{font-size:13px;color:var(--page-text-muted);margin-bottom:12px;line-height:1.5}
.end-block-btns{display:flex;gap:10px;flex-wrap:wrap}

.awaiting-feedback{text-align:center;padding:3rem 1rem;color:var(--page-text-muted)}
.awaiting-feedback .aw-title{font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.awaiting-feedback .aw-sub{font-size:12px}

.meta-label{font-size:11px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap}

.timer-dur-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.timer-dur-row label{font-size:10px;color:var(--page-text-muted);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap}
.timer-dur-row input{font-size:12px;border:1px solid var(--page-border);border-radius:3px;padding:3px 7px;width:52px;background:var(--input-bg);color:var(--page-text);font-family:inherit}

.turn0-banner{background:rgba(122,106,42,0.15);border:1px solid #C8B84A;border-radius:3px;padding:12px 16px;margin-bottom:1rem;font-size:13px;color:#C8B84A;line-height:1.6}
.turn0-banner strong{text-transform:uppercase;letter-spacing:0.05em}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 3rem}
</style>

  gameTime:'wg_gametime', turn:'wg_turn',

function getRef(key) {
  initFirebase();
  return db.ref(`wargames/${GAME_ID}/${key}`);
}

function store(key, val) {
  getRef(key).set(val);
}

function load(key, def) {
  return new Promise((resolve) => {
    getRef(key).once('value', snap => {
      resolve(snap.val() !== null ? snap.val() : def);
    });
  });
}

function onChange(key, callback) {
  getRef(key).on('value', snap => callback(snap.val()));
}

function makeSelect(opts,placeholder,val=''){
  let s=`<select><option value="" disabled ${val?'':'selected'}>${placeholder}</option>`;
  opts.forEach(o=>s+=`<option${o===val?' selected':''}>${o}</option>`);
  return s+'</select>';
}

function pad(n){return String(n).padStart(2,'0');}

// ─────────────────────────────────────────────
// TIMER STATE
// ─────────────────────────────────────────────
let timerSec=900,timerRunning=false,timerInterval=null;

function startTimer(){
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning=false;
    const btn=document.getElementById('timer-btn');
    if(btn) btn.textContent='Start';
  } else {
    timerRunning=true;
    const btn=document.getElementById('timer-btn');
    if(btn) btn.textContent='Pause';
    timerInterval=setInterval(()=>{
      if(timerSec>0){
        timerSec--;
        const display=pad(Math.floor(timerSec/60))+':'+pad(timerSec%60);
        const el=document.getElementById('turn-timer');
        if(el) el.textContent=display;
        store(K.timerDisplay,display);
      } else {
        clearInterval(timerInterval);
        timerRunning=false;
        const btn=document.getElementById('timer-btn');
        if(btn) btn.textContent='Start';
        const el=document.getElementById('turn-timer');
        if(el){el.textContent='00:00';el.style.color='#C04A4A';}
        store(K.timerDisplay,'00:00');
      }
    },1000);
  }
}

function resetTimer(){
  clearInterval(timerInterval);
  timerRunning=false;
  const mins=load(K.timerDur,15);
  timerSec=mins*60;
  const display=pad(mins)+':00';
  const el=document.getElementById('turn-timer');
  if(el){el.textContent=display;el.style.color='';}
  const btn=document.getElementById('timer-btn');
  if(btn) btn.textContent='Start';
  store(K.timerDisplay,display);
}

function updateTimerDur(){
  const input=document.getElementById('timer-dur-input');
  const mins=parseInt(input.value)||15;
  store(K.timerDur,mins);
  if(!timerRunning){
    timerSec=mins*60;
    const display=pad(mins)+':00';
    const el=document.getElementById('turn-timer');
    if(el){el.textContent=display;el.style.color='';}
    store(K.timerDisplay,display);
  }
}

// GAME TIME HELPERS

function parseGameTime(str){
  const m=str.match(/D\+(\d+)\s*\/\s*(\d{1,2})(\d{2})L/i);
  if(m) return{day:parseInt(m[1]),hour:parseInt(m[2]),min:parseInt(m[3])};
  return null;
}
function fmtGameTime(day,hour,min){return `D+${day} / ${pad(hour)}${pad(min)}L`;}

// ─────────────────────────────────────────────
// INJECT LOG HELPERS
// ─────────────────────────────────────────────
// Returns injects relevant to a given team ('blue' | 'red')
function injectsForTeam(team){
  const log=load(K.injectLog,[]);
  return log.filter(inj=>{
    if(inj.recipients==='Both teams') return true;
    if(inj.recipients==='Blue only' && team==='blue') return true;
    if(inj.recipients==='Red only' && team==='red') return true;
    return false;
  });
}

// Render a single inject entry card (used in history and team feedback)
function renderInjectCard(inj){
  const structHtml=inj.struct?`<div class="inject-entry-struct"><div class="inject-entry-struct-label">Structural change</div>${escHtml(inj.struct)}</div>`:'';
  return `<div class="inject-entry">
    <div class="inject-entry-header">
      <span class="inject-entry-label">⚡ Director Inject — ${escHtml(inj.type||'Note')}</span>
      <span class="inject-entry-meta">Turn ${inj.turn} · ${escHtml(inj.gameTime)} · ${escHtml(inj.recipients)} · ${new Date(inj.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div class="inject-entry-note">${escHtml(inj.note).replace(/\n/g,'<br>')}</div>
    ${structHtml}
  </div>`;
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function dirInitClocks(){
  setInterval(()=>{

  const gt=load(K.gameTime,'D+2 / 1900L');
  const gcEl=document.getElementById('game-clock');
  if(gcEl) gcEl.textContent=gt;
}

function setGameTime(){
  const val=document.getElementById('game-time-input').value.trim();
  if(!val) return;
  const p=parseGameTime(val);
  if(!p) return;
  const s=fmtGameTime(p.day,p.hour,p.min);
  store(K.gameTime,s);
  const gcEl=document.getElementById('game-clock');
  if(gcEl) gcEl.textContent=s;
  document.getElementById('game-time-input').value='';
}

function advanceGameTime(){
  const cur=load(K.gameTime,'D+2 / 1900L');
  const p=parseGameTime(cur)||{day:2,hour:19,min:0};
  const hrs=parseInt(document.getElementById('advance-hrs').value)||6;
  p.hour+=hrs;
  while(p.hour>=24){p.hour-=24;p.day++;}
  const s=fmtGameTime(p.day,p.hour,p.min);
  store(K.gameTime,s);
  const gcEl=document.getElementById('game-clock');
  if(gcEl) gcEl.textContent=s;
}

function dirChangeTurn(d){
  let t=load(K.turn,0);
  t=Math.max(0,t+d);
  store(K.turn,t);
  dirSyncTurn();
  dirRenderTeamPanel('blue');
  dirRenderTeamPanel('red');
}

function dirSyncTurn(){

function dirTab(t){
  ['blue','red','inject','history'].forEach(id=>{
    const tab=document.getElementById('tab-'+id);
    const panel=document.getElementById('panel-'+id);
    if(tab) tab.classList.remove('active');
    if(panel) panel.classList.remove('active');
  });
  const tab=document.getElementById('tab-'+t);
  const panel=document.getElementById('panel-'+t);
  if(tab) tab.classList.add('active');
  if(panel) panel.classList.add('active');
  if(t==='history') dirRenderHistory();
  if(t==='inject') dirRenderInjectLogPreview();
}

}

  if(el) el.value='';
  const s=document.getElementById('status-'+team);
  if(s){s.textContent='Director\'s note cleared.';s.className='status-msg visible ok';}
}

function buildFbObj(team){
  const gt=load(K.gameTime,'D+2 / 1900L');
  return{
    turn:load(K.turn,0),
    nextTime:gt,
    collections:v('fb-'+team+'-coll'),
    manMov:v('fb-'+team+'-manmov'),
    manBDA:v('fb-'+team+'-manbda'),
    fireRes:v('fb-'+team+'-fireres'),
    fireStat:v('fb-'+team+'-firestat'),
    dirNote:v('fb-'+team+'-dirnote'),
    gameTime:gt,
  };
}

function v(id){
  const el=document.getElementById(id);
  return el?el.value:'';
}

function dirUpdateBadge(team,sub){
  const turn=load(K.turn,0);
  const hasNew=sub&&sub.turn===turn;
  const badge=document.getElementById('badge-'+team);
  if(!badge) return;
  if(hasNew){
    badge.textContent='submitted';
    badge.style.background=team==='blue'?'rgba(74,138,192,0.2)':'rgba(192,74,74,0.2)';
    badge.style.color=team==='blue'?'#4A8AC0':'#C04A4A';
  } else {
    badge.textContent='awaiting';
    badge.style.background='';
    badge.style.color='';
  }
}

function dirPushResults(team){
  const fb=buildFbObj(team);
  const sub=load(team==='blue'?K.blueSubmit:K.redSubmit,null);
  if(sub){
    const hist=load(K.history,[]);
    const turn=load(K.turn,0);
    let entry=hist.find(h=>h.turn===turn);
    if(!entry){entry={turn,blue:null,red:null,blueFb:null,redFb:null};hist.push(entry);}
    entry[team]=JSON.parse(JSON.stringify(sub));
    entry[team+'Fb']=JSON.parse(JSON.stringify(fb));
    store(K.history,hist);
  }
  store(team==='blue'?K.blueFb:K.redFb,fb);
  const s=document.getElementById('status-'+team);
  if(s){s.textContent=`Results pushed to ${team==='blue'?'Blue':'Red'} — Turn ${load(K.turn,0)}.`;s.className='status-msg visible ok';}
  resetTimer();
}

// ─────────────────────────────────────────────
// PUSH INJECT — now writes to injectLog
// ─────────────────────────────────────────────
function pushInject(){
  const note=document.getElementById('inject-note').value.trim();
  const struct=document.getElementById('inject-struct').value.trim();
  const rcpt=document.getElementById('inject-recipients').value;
  const type=document.getElementById('inject-type').value;

  if(!note){
    const s=document.getElementById('status-inject');
    s.textContent='Director note is required.';
    s.className='status-msg visible warn';
    return;
  }

  const turn=load(K.turn,0);
  const gt=load(K.gameTime,'D+2 / 1900L');

  // 1. Write to independent inject log
  const injectLog=load(K.injectLog,[]);
  const injectEntry={
    id:Date.now(),
    at:new Date().toISOString(),
    gameTime:gt,
    turn:turn,
    recipients:rcpt,
    type:type,
    note:note,
    struct:struct,
  };
  injectLog.push(injectEntry);
  store(K.injectLog,injectLog);

  // 2. Also append a short notice to team dirNote so they see it in real-time feedback
  //    (full inject card rendered separately via inject log)
  const shortNotice=`[INJECT — ${type} — ${gt}] ${note}${struct?'\n\nStructural change: '+struct:''}`;
  function applyToFeedback(fbKey){
    const existing=load(fbKey,null)||{turn,gameTime:gt,nextTime:gt,collections:'',manMov:'',manBDA:'',fireRes:'',fireStat:'',dirNote:''};
    existing.dirNote=(existing.dirNote?existing.dirNote+'\n\n':'')+shortNotice;
    existing.gameTime=gt;
    existing.nextTime=gt;
    store(fbKey,existing);
  }
  if(rcpt==='Both teams'||rcpt==='Blue only') applyToFeedback(K.blueFb);
  if(rcpt==='Both teams'||rcpt==='Red only') applyToFeedback(K.redFb);

  const s=document.getElementById('status-inject');
  s.textContent=`Inject logged and pushed to ${rcpt} — Turn ${turn} / ${gt}.`;
  s.className='status-msg visible ok';
  document.getElementById('inject-note').value='';
  document.getElementById('inject-struct').value='';

  dirRenderInjectLogPreview();
  dirRenderHistory();
}

// Render the inject log preview on the Director Inject tab
function dirRenderInjectLogPreview(){
  const el=document.getElementById('inject-log-preview');
  if(!el) return;
  const log=load(K.injectLog,[]);
  if(!log.length){
    el.innerHTML=`<div class="inject-feed-empty">No injects pushed yet.</div>`;
    return;
  }
  el.innerHTML=[...log].reverse().map(inj=>renderInjectCard(inj)).join('');
}

// ─────────────────────────────────────────────
// HISTORY — interleaves inject entries
// ─────────────────────────────────────────────
function dirRenderHistory(){
  const el=document.getElementById('panel-history');
  if(!el) return;

  const hist=load(K.history,[]);
  const injectLog=load(K.injectLog,[]);
  const openTurns=new Set([...el.querySelectorAll('.history-turn-body.open')].map(b=>b.dataset.turn));

  if(!hist.length&&!injectLog.length){
    el.innerHTML=`<div class="awaiting-feedback"><div class="aw-title">No turn history yet</div><div class="aw-sub">Completed turns will appear here after results are pushed. Injects will appear here as they are sent.</div></div>`;
    return;
  }

  // Build a merged, sorted timeline of turns and injects
  // Each item: {type:'turn', turn:N, data:h} or {type:'inject', inj:inj}
  const items=[];
  hist.forEach(h=>items.push({type:'turn',turn:h.turn,sortKey:h.turn*1e12,data:h}));
  injectLog.forEach(inj=>items.push({type:'inject',sortKey:inj.id,inj:inj}));

  // Sort: turns by turn number ascending, injects by timestamp
  // Within same turn number, injects that happened during that turn sit adjacent
  // We render newest first (reverse), so sort ascending then reverse
  items.sort((a,b)=>a.sortKey-b.sortKey);
  items.reverse();

  const headerHtml=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn-secondary" onclick="if(confirm('Clear all turn history and inject log?')){localStorage.removeItem('${K.history}');localStorage.removeItem('${K.injectLog}');dirRenderHistory();dirRenderInjectLogPreview();}">Clear history &amp; inject log</button>
  </div>`;

  const itemsHtml=items.map(item=>{
    if(item.type==='inject'){
      return`<div class="history-inject-block">
        <div class="history-inject-block-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span style="display:flex;align-items:center;gap:8px">
            <span class="inject-pill">⚡ Inject</span>
            <span class="phase-title" style="font-size:11px">${escHtml(item.inj.type||'Note')}</span>
          </span>
          <span class="section-tag" style="font-size:11px">Turn ${item.inj.turn} · ${escHtml(item.inj.gameTime)} · ${escHtml(item.inj.recipients)}</span>
        </div>
        <div class="history-inject-block-body">
          ${renderInjectCard(item.inj)}
        </div>
      </div>`;
    } else {
      const h=item.data;
      const isOpen=openTurns.has(String(h.turn));
      const blueRows=h.blue?renderHistoryRows(h.blue,h.blueFb):'<em style="font-size:12px;color:var(--page-text-muted)">No submission recorded.</em>';
      const redRows=h.red?renderHistoryRows(h.red,h.redFb):'<em style="font-size:12px;color:var(--page-text-muted)">No submission recorded.</em>';
      const gt=h.blueFb?h.blueFb.gameTime:h.redFb?h.redFb.gameTime:'';
      return`<div class="history-turn">
        <div class="history-turn-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span class="phase-title">Turn ${h.turn}${gt?' — '+gt:''}</span>
          <span class="section-tag" style="font-size:11px">click to expand</span>
        </div>
        <div class="history-turn-body${isOpen?' open':''}" data-turn="${h.turn}">
          <div class="history-team"><span class="history-team-label blue">Blue Force</span><div style="margin-top:6px">${blueRows}</div></div>
          <div class="history-team" style="margin-top:12px"><span class="history-team-label red">Red Force</span><div style="margin-top:6px">${redRows}</div></div>
        </div>
      </div>`;
    }
  }).join('');

  el.innerHTML=headerHtml+itemsHtml;
}

function renderHistoryRows(sub,fb){
  let out='';
  if(sub.collections&&sub.collections.length) out+=`<div class="history-entry"><strong>Collections</strong>${sub.collections.map(c=>[c.asset,c.nai,c.box,c.pir].filter(Boolean).join(' / ')).join(' | ')}</div>`;
  if(sub.maneuver&&sub.maneuver.length) out+=`<div class="history-entry"><strong>Maneuver</strong>${sub.maneuver.map(m=>`${m.unit}: ${m.action||'—'} → ${m.dest||'—'}`).join(' | ')}</div>`;
  if(sub.fires&&sub.fires.length) out+=`<div class="history-entry"><strong>Fires</strong>${sub.fires.map(f=>`${f.asset} on ${f.grid} (${f.effect})`).join(' | ')}</div>`;
  if(sub.cmdNote) out+=`<div class="history-entry"><strong>Cmd Note</strong>"${escHtml(sub.cmdNote)}"</div>`;
  if(fb){
    if(fb.collections) out+=`<div class="history-entry" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--page-border)"><strong>Adj — Collections</strong>${escHtml(fb.collections)}</div>`;
    if(fb.manMov) out+=`<div class="history-entry"><strong>Adj — Maneuver</strong>${escHtml(fb.manMov)}</div>`;
    if(fb.manBDA) out+=`<div class="history-entry"><strong>Adj — BDA</strong>${escHtml(fb.manBDA)}</div>`;
    if(fb.fireRes) out+=`<div class="history-entry"><strong>Adj — Fires</strong>${escHtml(fb.fireRes)}</div>`;
    if(fb.dirNote) out+=`<div class="history-entry"><strong>Dir Note</strong>${escHtml(fb.dirNote)}</div>`;
  }
  return out||'<em style="font-size:12px;color:var(--page-text-muted)">Empty submission.</em>';
}

function togglePhase(id){
  const el=document.getElementById(id);
  if(!el) return;
  const btn=el.previousElementSibling?el.previousElementSibling.querySelector('.phase-toggle'):null;
  if(el.style.display==='none'){el.style.display='';if(btn)btn.textContent='collapse';}
  else{el.style.display='none';if(btn)btn.textContent='expand';}
}

function endGame(){
  if(!confirm('Call end of game? Teams will be notified and may submit their final turn. Turn history locks after you submit the AAR note.')) return;
  const gt=load(K.gameTime,'D+2 / 1900L');
  store(K.gameEnded,{ended:true,time:gt,at:new Date().toISOString()});
  function applyEnd(fbKey){
    const existing=load(fbKey,null)||{turn:load(K.turn,0),gameTime:gt,nextTime:gt,collections:'',manMov:'',manBDA:'',fireRes:'',fireStat:'',dirNote:''};
    existing.dirNote=(existing.dirNote?existing.dirNote+'\n\n':'')+'[GAME ENDED] The director has called end of game at '+gt+'. Submit your final tasks, then report to the Director\'s Table to brief your last turn and debrief.';
    store(fbKey,existing);
  }
  applyEnd(K.blueFb);
  applyEnd(K.redFb);
  const gcEl=document.getElementById('game-clock');
  if(gcEl){gcEl.textContent=gt+' — END';gcEl.style.color='#C04A4A';gcEl._ended=true;}
  const s=document.getElementById('status-inject-end');
  if(s){s.textContent='End of game called. Teams notified. Complete the AAR note below to lock turn history.';s.className='status-msg visible ok';}
  const aarBlock=document.getElementById('aar-capture-block');
  if(aarBlock){aarBlock.style.display='';setTimeout(()=>aarBlock.scrollIntoView({behavior:'smooth',block:'nearest'}),100);}
}

function submitAAR(){
  const note=document.getElementById('aar-note-input').value.trim();
  if(!note){
    const s=document.getElementById('status-aar');
    s.textContent='Enter at least one debrief point before locking.';
    s.className='status-msg visible warn';
    return;
  }
  store(K.aarNote,note);
  store(K.historyLocked,true);
  const s=document.getElementById('status-aar');
  s.textContent='AAR note saved. Turn history locked.';
  s.className='status-msg visible ok';
  const dlBtn=document.getElementById('dl-pdf-btn');
  if(dlBtn) dlBtn.style.display='';
}

function resetGame(){
  if(!confirm('Reset to Turn 0? This will clear ALL submissions, feedback, inject log, and turn history. This cannot be undone.')) return;
  [K.blueSubmit,K.redSubmit,K.blueFb,K.redFb,K.history,K.gameEnded,K.aarNote,K.historyLocked,K.injectLog].forEach(k=>localStorage.removeItem(k));
  const aarBlock=document.getElementById('aar-capture-block');
  if(aarBlock) aarBlock.style.display='none';
  store(K.turn,0);
  store(K.gameTime,'D+2 / 1900L');
  const gcEl=document.getElementById('game-clock');
  if(gcEl){gcEl.textContent='D+2 / 1900L';gcEl.style.color='';gcEl._ended=false;}
  dirSyncTurn();
  dirRenderTeamPanel('blue');
  dirRenderTeamPanel('red');
  dirRenderHistory();
  dirRenderInjectLogPreview();
  const s=document.getElementById('status-inject-end');
  if(s){s.textContent='Game reset to Turn 0. All forms, history, and inject log cleared.';s.className='status-msg visible warn';}
  resetTimer();
}

function downloadPDF(){
  const hist=load(K.history,[]);
  const injectLog=load(K.injectLog,[]);
  const gt=load(K.gameTime,'D+2 / 1900L');
  const aarNote=load(K.aarNote,'');
  let content=`<h1 style="font-family:monospace;text-transform:uppercase;letter-spacing:0.1em">AMWC Wargame — After Action Review</h1>`;
  content+=`<p style="font-family:monospace;font-size:12px;color:#666;margin:6px 0 24px">Game ended: ${gt} | Generated: ${new Date().toLocaleString()}</p>`;
  if(aarNote){
    content+=`<h2 style="font-family:monospace;text-transform:uppercase;font-size:13px;border-bottom:2px solid #333;padding-bottom:6px;margin:0 0 12px">Director's AAR Notes — Debrief Points</h2>`;
    content+=`<p style="font-family:monospace;font-size:12px;white-space:pre-wrap;margin-bottom:24px;padding:12px;background:#f8f8f8;border:1px solid #ddd">${aarNote}</p>`;
  }
  // Inject log section
  if(injectLog.length){
    content+=`<h2 style="font-family:monospace;text-transform:uppercase;font-size:13px;border-bottom:2px solid #C8B84A;padding-bottom:6px;margin:24px 0 12px">Director Inject Log (${injectLog.length})</h2>`;
    injectLog.forEach(inj=>{
      content+=`<div style="margin-bottom:12px;padding:10px 12px;border-left:4px solid #C8B84A;background:#fdfaf0;font-family:monospace;font-size:11px">`;
      content+=`<p style="margin:0 0 4px;color:#7A6A2A;font-weight:bold;text-transform:uppercase;font-size:10px">⚡ ${inj.type||'Inject'} — Turn ${inj.turn} · ${inj.gameTime} · ${inj.recipients}</p>`;
      content+=`<p style="margin:0 0 4px;white-space:pre-wrap">${inj.note}</p>`;
      if(inj.struct) content+=`<p style="margin:4px 0 0;color:#666"><strong>Structural change:</strong> ${inj.struct}</p>`;
      content+=`</div>`;
    });
  }
  // Turn history
  if(!hist.length){content+='<p style="font-family:monospace">No turn history recorded.</p>';}
  hist.forEach(h=>{
    content+=`<h2 style="font-family:monospace;text-transform:uppercase;font-size:14px;border-bottom:2px solid #333;padding-bottom:6px;margin:24px 0 12px">Turn ${h.turn}${h.blueFb?` — ${h.blueFb.gameTime}`:''}</h2>`;
    ['blue','red'].forEach(team=>{
      const sub=h[team];const fb=h[team+'Fb'];
      content+=`<h3 style="font-family:monospace;text-transform:uppercase;font-size:12px;color:${team==='blue'?'#1A3A5C':'#6B1A1A'};margin:12px 0 6px">${team==='blue'?'Blue Force':'Red Force'}</h3>`;
      if(sub){
        if(sub.collections&&sub.collections.length) content+=`<p style="font-family:monospace;font-size:11px"><strong>Collections:</strong> ${sub.collections.map(c=>[c.asset,c.nai,c.box,c.pir].filter(Boolean).join(' / ')).join(' | ')}</p>`;
        if(sub.maneuver&&sub.maneuver.length) content+=`<p style="font-family:monospace;font-size:11px"><strong>Maneuver:</strong> ${sub.maneuver.map(m=>`${m.unit}: ${m.action||'—'} → ${m.dest||'—'}`).join(' | ')}</p>`;
        if(sub.fires&&sub.fires.length) content+=`<p style="font-family:monospace;font-size:11px"><strong>Fires:</strong> ${sub.fires.map(f=>`${f.asset} on ${f.grid} (${f.effect})`).join(' | ')}</p>`;
        if(sub.cmdNote) content+=`<p style="font-family:monospace;font-size:11px"><strong>Cmd Note:</strong> "${sub.cmdNote}"</p>`;
      } else {content+=`<p style="font-family:monospace;font-size:11px;color:#999">No submission recorded.</p>`;}
      if(fb){
        content+=`<p style="font-family:monospace;font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid #ddd">`;
        if(fb.collections) content+=`<strong>Adj-Collections:</strong> ${fb.collections}<br>`;
        if(fb.manMov) content+=`<strong>Adj-Maneuver:</strong> ${fb.manMov}<br>`;
        if(fb.manBDA) content+=`<strong>Adj-BDA:</strong> ${fb.manBDA}<br>`;
        if(fb.fireRes) content+=`<strong>Adj-Fires:</strong> ${fb.fireRes}<br>`;
        if(fb.dirNote) content+=`<strong>Dir Note:</strong> ${fb.dirNote}<br>`;
        content+=`</p>`;
      }
    });
  });
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>AMWC AAR</title><style>body{margin:2cm;font-family:monospace}@media print{body{margin:1cm}}</style></head><body>${content}<script>window.onload=function(){window.print();}<\/script></body></html>`);
  win.document.close();
}

  <div class="top-bar">

        <span class="clock-value" id="team-realclock">—</span>
      </div>

        <span class="clock-label">Turn timer</span>

      </div>

  `;

  setInterval(()=>{

  document.getElementById('tpanel-'+t).classList.add('active');
}

  // Build inject section HTML (shown above adjudication if there are any)

  if(myInjects.length){
    // Show most recent first

    injectSectionHtml=`
    <div class="inject-feed-section">
      <div class="inject-feed-header">
        <span class="inject-feed-title">⚡ Director Injects (${myInjects.length})</span>
        <span style="font-size:10px;color:#C8B84A;letter-spacing:0.04em">Most recent first</span>
      </div>
      <div class="inject-feed-body">${cards}</div>
    </div>`;
  }

  if(!fb){
    el.innerHTML=`${injectSectionHtml}<div class="awaiting-feedback"><div class="aw-title">${turn===0?'Turn 0 — Awaiting Confirmation':'Awaiting director\'s table'}</div><div class="aw-sub">${turn===0?'Submit your initial force laydown on the Turn Card. The director will confirm positions before Turn 1 begins.':'Results will appear here once the director pushes feedback.'}</div></div>`;
    return;
  }

  const empty=s=>!s||!s.trim();
  el.innerHTML=`
  ${injectSectionHtml}
  <div class="phase-section">
    <div class="phase-header"><span class="phase-title">Collections</span></div>
    <div class="phase-body">
      <div class="feedback-label">ISR results — Turn ${fb.turn}</div>
      <div class="feedback-block ${empty(fb.collections)?'empty':''}">${escHtml(fb.collections)||'No collections feedback provided.'}</div>
    </div>
  </div>
  <div class="phase-section">
    <div class="phase-header"><span class="phase-title">Maneuver</span></div>
    <div class="phase-body">
      <div class="adj-row">
        <div><div class="feedback-label">Movement results</div><div class="feedback-block ${empty(fb.manMov)?'empty':''}">${escHtml(fb.manMov)||'No movement feedback provided.'}</div></div>
        <div><div class="feedback-label">Contact / BDA</div><div class="feedback-block ${empty(fb.manBDA)?'empty':''}">${escHtml(fb.manBDA)||'No contact or BDA this turn.'}</div></div>
      </div>
    </div>
  </div>
  <div class="phase-section">
    <div class="phase-header"><span class="phase-title">Fires</span></div>
    <div class="phase-body">
      <div class="adj-row">
        <div><div class="feedback-label">Fire mission results / BDA</div><div class="feedback-block ${empty(fb.fireRes)?'empty':''}">${escHtml(fb.fireRes)||'No fires feedback provided.'}</div></div>
        <div><div class="feedback-label">Asset status after execution</div><div class="feedback-block ${empty(fb.fireStat)?'empty':''}">${escHtml(fb.fireStat)||'No asset status update.'}</div></div>
      </div>
    </div>
  </div>
  ${fb.dirNote?`<div class="director-note"><div class="director-note-label">Director's note</div>${escHtml(fb.dirNote).replace(/\n/g,'<br>')}</div>`:''}
  <div style="margin-top:0.5rem;text-align:right">
    <button class="btn-primary" onclick="teamTab('turncard')">Proceed to turn card →</button>
  </div>`;
}

function teamRenderTurnCard(team){
  const el=document.getElementById('tpanel-turncard');
  if(!el) return;
  const seeds=team==='blue'?SEED_BLUE:SEED_RED;
  const turn=load(K.turn,0);
  const gt=load(K.gameTime,'D+2 / 1900L');
  const prevSub=turn>0?load(team==='blue'?K.blueSubmit:K.redSubmit,null):null;
  const manSource=prevSub?prevSub.maneuver:seeds.map(s=>({unit:s.unit,pos:'',action:'',dest:''}));
  const collSource=(prevSub&&turn>0)?prevSub.collections:[];

  const turn0Note=turn===0?`<div class="turn0-banner" style="margin-bottom:1rem"><strong>Turn 0 — Initial Laydown.</strong> Enter your force positions and submit your commander's intent. Leave fires empty. The director will confirm your positions before Turn 1.</div>`:'';

  const manRowsHtml=manSource.map((m)=>`
    <div class="entry-row maneuver-row">
      <div class="field"><input type="text" class="man-unit" value="${escHtml(m.unit||'')}"></div>
      <div class="field"><input type="text" class="man-pos auto-pop" value="${turn===0?'':(escHtml(m.dest||m.pos||''))}" placeholder="Grid"></div>
      <div class="field">${makeSelect(MAN_ACTIONS,'select action',turn===0?'':m.action||'')}</div>
      <div class="field"><input type="text" class="man-dest" placeholder="Grid or named feature — purpose" value=""></div>
      <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>`).join('');

  const collRowsHtml=collSource.map((c)=>`
    <div class="entry-row collections-row">
      <div class="field"><input type="text" class="coll-asset" value="${escHtml(c.asset||'')}"></div>
      <div class="field"><input type="text" class="coll-nai" value="${escHtml(c.nai||'')}"></div>
      <div class="field">${makeSelect(BOX_SIZES,'select size',c.box||'')}</div>
      <div class="field"><input type="text" class="coll-pir" value="${escHtml(c.pir||'')}"></div>
      <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>`).join('');

  el.innerHTML=`
  ${turn0Note}
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="phase-title" style="font-size:13px">Turn Card</span>
      <span style="font-size:11px;font-weight:700;background:var(--page-surface2);color:var(--page-text-muted);padding:3px 10px;border-radius:3px;border:1px solid var(--page-border);letter-spacing:0.04em;text-transform:uppercase">Turn ${turn}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="meta-label">Game time</span>
      <input type="text" id="tc-gametime" value="${gt}" style="width:130px;border:1px solid var(--input-border);border-radius:3px;padding:5px 9px;background:var(--input-bg);color:var(--page-text);font-family:inherit;font-size:13px" onchange="this._userEdited=true">
    </div>
  </div>

  <div class="section">
    <div class="section-header"><span class="section-title">Collections</span><span class="section-tag">ISR tasking &amp; targeting support${turn===0?' — leave empty for initial laydown':''}</span></div>
    <div class="section-body">
      <div class="entry-row collections-row" style="margin-bottom:4px">
        <div class="col-head">Asset</div><div class="col-head">NAI center grid</div><div class="col-head">Box size</div><div class="col-head">PIR / targeting purpose</div><div></div>
      </div>
      <div id="tc-coll-rows">${collRowsHtml}</div>
      <button class="add-btn" onclick="tcAddRow('coll')">+ add asset</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><span class="section-title">Maneuver</span><span class="section-tag">${turn===0?'Enter initial force positions':'Positions carried forward from last turn'}</span></div>
    <div class="section-body">
      <div class="entry-row maneuver-row" style="margin-bottom:4px">
        <div class="col-head">Unit</div><div class="col-head">Current position</div><div class="col-head">Action</div><div class="col-head">Destination / objective</div><div></div>
      </div>
      <div id="tc-man-rows">${manRowsHtml}</div>
      <button class="add-btn" onclick="tcAddRow('man')">+ add unit</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><span class="section-title">Fires</span><span class="section-tag">Fire missions this turn${turn===0?' — leave empty for initial laydown':''}</span></div>
    <div class="section-body">
      <div class="entry-row fires-row" style="margin-bottom:4px">
        <div class="col-head">Asset</div><div class="col-head">Target grid</div><div class="col-head">Target description</div><div class="col-head">Desired effect</div><div class="col-head">Timing / trigger</div><div></div>
      </div>
      <div id="tc-fires-rows"></div>
      <button class="add-btn" onclick="tcAddRow('fires')">+ add fire mission</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><span class="section-title">Commander's note</span><span class="section-tag">Main effort and key decision this turn</span></div>
    <div class="section-body">
      <div class="field" style="margin:0"><textarea id="tc-cmdnote" placeholder="${turn===0?'State your commander\'s intent and initial scheme of maneuver.':'State the main effort and the decision driving it this turn.'}" style="min-height:72px"></textarea></div>
    </div>
  </div>

  <div class="submit-row">
    <div id="tc-status" class="status-bar"></div>
    <button class="btn-secondary" onclick="tcClearFires()">Clear fires</button>
    <button class="btn-primary" onclick="tcSubmit('${team}')">${turn===0?'Submit initial laydown ↗':'Submit to director\'s table ↗'}</button>
  </div>`;
}

function tcAddRow(type){
  if(type==='coll'){
    const d=document.createElement('div');
    d.className='entry-row collections-row';
    d.innerHTML=`<div class="field"><input type="text" class="coll-asset" placeholder="RQ-20, MQ-9…"></div><div class="field"><input type="text" class="coll-nai" placeholder="BK 0512 4231"></div><div class="field">${makeSelect(BOX_SIZES,'select size')}</div><div class="field"><input type="text" class="coll-pir" placeholder="Confirm enemy axis IVO…"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-coll-rows').appendChild(d);
  } else if(type==='man'){
    const d=document.createElement('div');
    d.className='entry-row maneuver-row';
    d.innerHTML=`<div class="field"><input type="text" class="man-unit" placeholder="Unit designation"></div><div class="field"><input type="text" class="man-pos auto-pop" placeholder="Grid"></div><div class="field">${makeSelect(MAN_ACTIONS,'select action')}</div><div class="field"><input type="text" class="man-dest" placeholder="Grid or named feature — purpose"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-man-rows').appendChild(d);
  } else {
    const d=document.createElement('div');
    d.className='entry-row fires-row';
    d.innerHTML=`<div class="field"><input type="text" class="fire-asset" placeholder="M777, AH-1Z…"></div><div class="field"><input type="text" class="fire-grid" placeholder="BK 0512 4231"></div><div class="field"><input type="text" class="fire-desc" placeholder="Description"></div><div class="field">${makeSelect(EFFECTS,'effect')}</div><div class="field"><input type="text" class="fire-timing" placeholder="On order / H+30 / on contact"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-fires-rows').appendChild(d);
  }
}

function tcClearFires(){
  document.getElementById('tc-fires-rows').innerHTML='';
  showTcStatus('Fires cleared.','ok');
}

function tcSubmit(team){
  const note=document.getElementById('tc-cmdnote').value.trim();
  if(!note){showTcStatus("Commander's note is required.",'warn');return;}

  const collRows=[...document.querySelectorAll('#tc-coll-rows .entry-row')];
  const collections=collRows.map(r=>({
    asset:r.querySelector('.coll-asset')?.value||'',
    nai:r.querySelector('.coll-nai')?.value||'',
    box:r.querySelector('select')?.value||'',
    pir:r.querySelector('.coll-pir')?.value||'',
  }));

  const manRows=[...document.querySelectorAll('#tc-man-rows .entry-row')];
  const maneuver=manRows.map(r=>({
    unit:r.querySelector('.man-unit')?.value||'',
    pos:r.querySelector('.man-pos')?.value||'',
    action:r.querySelector('select')?.value||'',
    dest:r.querySelector('.man-dest')?.value||'',
  }));

  const fireRows=[...document.querySelectorAll('#tc-fires-rows .entry-row')];
  const fires=fireRows.map(r=>({
    asset:r.querySelector('.fire-asset')?.value||'',
    grid:r.querySelector('.fire-grid')?.value||'',
    desc:r.querySelector('.fire-desc')?.value||'',
    effect:r.querySelector('select')?.value||'',
    timing:r.querySelector('.fire-timing')?.value||'',
  }));

  const gt=document.getElementById('tc-gametime')?.value||load(K.gameTime,'D+2 / 1900L');
  const turn=load(K.turn,0);
  const submission={turn,gameTime:gt,team,collections,maneuver,fires,cmdNote:note,submittedAt:new Date().toISOString()};
  store(team==='blue'?K.blueSubmit:K.redSubmit,submission);
  showTcStatus(`${team==='blue'?'Blue':'Red'} ${turn===0?'initial laydown':'turn card'} submitted — ${gt}. Awaiting director's table.`,'ok');
}

function showTcStatus(msg,type){
  const el=document.getElementById('tc-status');
  if(!el) return;
  el.textContent=msg;
  el.className='status-bar visible '+(type||'');
}
</script>
</body>
</html>
