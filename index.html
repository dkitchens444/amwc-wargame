<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMWC Wargame System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Courier New',Courier,monospace}
:root{
  --mil-green:#3B4A2F;--mil-green-mid:#4E6238;--mil-green-light:#7A8F64;
  --mil-gold:#7A6A2A;--mil-ok-border:#8A9E72;--mil-warn-border:#C8B84A;
}
body.role-director{
  --page-bg:#1A1E16;--page-surface:#22271C;--page-surface2:#2C3224;
  --page-border:#3E4A32;--page-text:#D8DDD0;--page-text-muted:#8A9A7A;
  --page-accent:#7A8F64;--input-bg:#181C14;--input-border:#3E4A32;
  --btn-surface:#2C3224;--btn-hover:#3B4A2F;
  background:var(--page-bg);color:var(--page-text);
}
body.role-blue{
  --page-bg:#111820;--page-surface:#17222E;--page-surface2:#1E2E3E;
  --page-border:#2A4A6A;--page-text:#C8D8E8;--page-text-muted:#6A8AAA;
  --page-accent:#4A8AC0;--input-bg:#111820;--input-border:#2A4A6A;
  --btn-surface:#1E2E3E;--btn-hover:#2A3E52;
  background:var(--page-bg);color:var(--page-text);
}
body.role-red{
  --page-bg:#1A1010;--page-surface:#221717;--page-surface2:#2E1E1E;
  --page-border:#5A2A2A;--page-text:#E8C8C8;--page-text-muted:#AA6A6A;
  --page-accent:#C04A4A;--input-bg:#1A1010;--input-border:#5A2A2A;
  --btn-surface:#2E1E1E;--btn-hover:#3E2A2A;
  background:var(--page-bg);color:var(--page-text);
}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 3rem}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--page-text-muted)}
.loading-screen .ls-title{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.loading-screen .ls-sub{font-size:11px;letter-spacing:0.05em}
.spinner{width:28px;height:28px;border:3px solid var(--page-border);border-top-color:var(--page-accent,#7A8F64);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8ACA6A;margin-left:8px;vertical-align:middle;transition:background 0.3s,box-shadow 0.3s}
.sync-dot.live{background:#8ACA6A;box-shadow:0 0 6px #8ACA6A}
.sync-dot.off{background:#C04A4A;box-shadow:0 0 4px #C04A4A}
.sync-dot.connecting{background:#C8B84A;box-shadow:0 0 4px #C8B84A}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:2px solid var(--page-accent)}
.top-left{display:flex;flex-direction:column;gap:8px}
.top-title{font-size:17px;font-weight:700;color:var(--page-text);letter-spacing:0.1em;text-transform:uppercase}
.role-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid}
.role-badge.dir{background:var(--page-surface2);color:#7A8F64;border-color:#7A8F64}
.role-badge.blue{background:rgba(74,138,192,0.2);color:#4A8AC0;border-color:#4A8AC0}
.role-badge.red{background:rgba(192,74,74,0.2);color:#C04A4A;border-color:#C04A4A}
.clocks{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.clock-block{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;background:var(--page-surface2);border-radius:3px;border:1px solid var(--page-border)}
.clock-label{font-size:10px;color:var(--page-text-muted);letter-spacing:0.07em;text-transform:uppercase;font-weight:500}
.clock-value{font-size:15px;font-weight:700;color:var(--page-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-value.game{color:var(--page-accent)}
.clock-with-btn{display:flex;align-items:flex-start;gap:6px}
.timer-btns{display:flex;flex-direction:column;gap:3px}
.game-clock-controls{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.gclock-row{display:flex;align-items:center;gap:6px}
.gclock-row label{font-size:11px;color:var(--page-text-muted);white-space:nowrap;font-weight:500;letter-spacing:0.03em}
.gclock-row input{font-size:12px;border:1px solid var(--page-border);border-radius:3px;padding:4px 8px;background:var(--input-bg);color:var(--page-text);font-family:inherit}
.team-clocks-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* ── DIRECTOR PREMIUM TOP BAR — responsive ────────────────── */
/* Outer bar wraps into rows only on narrow screens */
.dir-top-bar{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:0;
  margin-bottom:1.25rem;padding-bottom:1rem;
  border-bottom:2px solid var(--page-accent);
  width:100%;box-sizing:border-box;
}

/* ── LEFT: identity + turn ── */
.dir-top-identity{
  display:flex;flex-direction:column;justify-content:center;gap:7px;
  padding:8px 16px 8px 0;
  border-right:1px solid var(--page-border);
  flex:0 0 auto;
}
.dir-top-title-row{display:flex;align-items:center;gap:7px}
.dir-title{font-size:13px;font-weight:700;color:var(--page-text);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap}
.dir-turn-block{display:flex;align-items:center;gap:7px}
.dir-block-label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--page-text-muted);white-space:nowrap}
.dir-turn-controls{display:flex;align-items:center;gap:4px}
.dir-ctrl-btn{font-size:13px;line-height:1;padding:3px 8px;border:1px solid var(--page-border);border-radius:3px;background:var(--btn-surface);color:var(--page-text);cursor:pointer;font-family:inherit;font-weight:700;flex-shrink:0}
.dir-ctrl-btn:hover{background:var(--btn-hover);border-color:var(--page-accent)}
.dir-turn-val{font-size:16px;font-weight:700;min-width:22px;text-align:center;color:var(--page-text);font-variant-numeric:tabular-nums}

/* ── CENTER: 3 clocks always on one row ── */
.dir-top-clocks{
  display:flex;align-items:center;justify-content:center;flex:1 1 0;
  padding:0 10px;
  flex-wrap:nowrap;
  /* No overflow:hidden — it collapses clocks to zero at narrow widths */
  overflow:visible;
  min-width:0;
}
.dir-clock-card{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 8px;flex-shrink:1;min-width:0;
}
.dir-clock-label{
  font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--page-text-muted);white-space:nowrap;
}
.dir-clock-val{
  /* Fixed size — clamp(vw) collapses below 14px at 390px viewport; use fixed px */
  font-size:14px;
  font-weight:700;color:var(--page-text);
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:0.02em;
}
/* Scale up on wider screens */
@media (min-width:700px){
  .dir-clock-val{font-size:18px;}
}
@media (min-width:900px){
  .dir-clock-val{font-size:20px;}
}
.dir-clock-accent{color:var(--page-accent)}
.dir-clock-divider{width:1px;height:30px;background:var(--page-border);flex-shrink:0;align-self:center}

/* ── RIGHT: game time + timer controls ── */
.dir-top-controls{
  display:flex;align-items:flex-start;gap:0;
  padding:8px 0 8px 16px;
  border-left:1px solid var(--page-border);
  flex:0 0 auto;flex-wrap:wrap;
}
.dir-ctrl-group{display:flex;flex-direction:column;gap:5px;padding:0 10px}
.dir-ctrl-group:first-child{padding-left:0}
.dir-ctrl-divider{width:1px;align-self:stretch;background:var(--page-border);flex-shrink:0}
.dir-ctrl-row{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.dir-action-btn{
  font-size:10px;padding:4px 7px;border:1px solid var(--page-border);border-radius:3px;
  background:var(--btn-surface);color:var(--page-text);cursor:pointer;font-weight:700;
  letter-spacing:0.04em;text-transform:uppercase;font-family:inherit;white-space:nowrap;flex-shrink:0;
}
.dir-action-btn:hover{background:var(--btn-hover);border-color:var(--page-accent)}
.dir-text-input{
  font-size:11px;border:1px solid var(--page-border);border-radius:3px;
  padding:4px 6px;background:var(--input-bg);color:var(--page-text);font-family:inherit;
  width:90px;min-width:0;
}
.dir-text-input:focus{outline:2px solid var(--page-accent);outline-offset:1px}
.dir-num-input{
  font-size:11px;border:1px solid var(--page-border);border-radius:3px;
  padding:4px 4px;background:var(--input-bg);color:var(--page-text);font-family:inherit;
  width:34px;text-align:center;flex-shrink:0;
}
.dir-unit-label{font-size:10px;color:var(--page-text-muted);font-weight:500;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap}

/* ── RESPONSIVE: below 430px stack into vertical rows (mobile only) ── */
@media (max-width:430px){
  .dir-top-bar{flex-direction:column}
  .dir-top-identity{
    border-right:none;border-bottom:1px solid var(--page-border);
    padding:8px 0;width:100%;
  }
  .dir-top-clocks{
    display:flex;
    border-bottom:1px solid var(--page-border);
    padding:4px 0;width:100%;
    flex-direction:column;align-items:stretch;
    overflow:visible;
  }
  .dir-clock-card{
    flex-direction:row;justify-content:space-between;align-items:center;
    padding:6px 2px;border-bottom:1px solid var(--page-border);
  }
  .dir-clock-card:last-child{border-bottom:none}
  .dir-clock-label{text-align:left}
  .dir-clock-val{text-align:right;font-size:14px}
  .dir-clock-divider{display:none}
  .dir-top-controls{
    border-left:none;padding:8px 0;width:100%;
  }
  .dir-ctrl-group{padding:0 8px}
  .dir-ctrl-group:first-child{padding-left:0}
}

/* Team top bar untouched — uses .top-bar / .team-clocks-bar */
/* ─────────────────────────────────────────────────────────── */
.turn-controls{display:flex;align-items:center;gap:8px}
.tc-label{font-size:11px;color:var(--page-text-muted);font-weight:500;letter-spacing:0.05em;text-transform:uppercase}
.tc-btn{font-size:12px;padding:4px 10px;border:1px solid var(--page-border);border-radius:3px;background:var(--btn-surface);color:var(--page-text);cursor:pointer;font-weight:500;font-family:inherit}
.tc-btn:hover{background:var(--btn-hover);border-color:var(--page-accent)}
.tc-val{font-size:14px;font-weight:700;min-width:20px;text-align:center;color:var(--page-text)}
.team-tabs{display:flex;gap:0;margin-bottom:1rem;border:1px solid var(--page-border);border-radius:3px;overflow:hidden}
.tab{flex:1;padding:9px 0;font-size:12px;font-weight:700;text-align:center;cursor:pointer;background:var(--btn-surface);color:var(--page-text-muted);border:none;border-right:1px solid var(--page-border);letter-spacing:0.06em;text-transform:uppercase;font-family:inherit;transition:background 0.15s}
.tab:last-child{border-right:none}
.tab:hover{background:var(--btn-hover)}
.tab.active{color:var(--page-text);background:var(--page-surface2);border-bottom:2px solid var(--page-accent)}
.tab .sub-badge{font-size:10px;margin-left:6px;padding:2px 7px;border-radius:2px;font-weight:500;font-family:inherit}
.panel{display:none}.panel.active{display:block}
.section,.phase-section{background:var(--page-surface);border:1px solid var(--page-border);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.section-header,.phase-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--page-surface2);border-bottom:1px solid var(--page-border)}
.section-title,.phase-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--page-text)}
.section-tag{font-size:11px;color:var(--page-text-muted)}
.phase-toggle{font-size:11px;color:var(--page-text-muted);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;letter-spacing:0.03em;font-family:inherit}
.section-body,.phase-body{padding:14px}
.submission-block{background:var(--page-bg,#111);border:1px solid var(--page-border);border-radius:3px;padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--page-accent)}
.sub-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:8px;font-size:12px;margin-bottom:4px;color:var(--page-text)}
.sub-row.fires-sub-row{grid-template-columns:1fr 1fr 1fr 1fr 1.2fr;}
.sub-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sub-row span:first-child{font-weight:700}
.no-submission{font-size:12px;color:var(--page-text-muted);font-style:italic;padding:4px 0}
.feedback-block{background:var(--page-surface2);border:1px solid var(--page-border);border-radius:3px;padding:12px 14px;margin-bottom:10px;line-height:1.6;font-size:13px;color:var(--page-text)}
.feedback-block.empty{color:var(--page-text-muted);font-style:italic}
.feedback-label{font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--page-text-muted);margin-bottom:6px}
.director-note{background:rgba(122,106,42,0.15);border:1px solid #C8B84A;border-left:3px solid #7A6A2A;border-radius:3px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--page-text);line-height:1.6}
.director-note-label{font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#C8B84A;margin-bottom:5px}
.inject-entry{background:rgba(122,106,42,0.12);border:1px solid #C8B84A;border-left:4px solid #7A6A2A;border-radius:3px;padding:12px 14px;margin-bottom:10px}
.inject-entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.inject-entry-label{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#C8B84A}
.inject-entry-meta{font-size:10px;color:var(--page-text-muted);letter-spacing:0.03em}
.inject-entry-note{font-size:13px;color:var(--page-text);line-height:1.6;margin-bottom:6px}
.inject-entry-struct{font-size:12px;color:var(--page-text-muted);line-height:1.5;padding-top:6px;border-top:1px solid rgba(200,184,74,0.25);margin-top:6px}
.inject-entry-struct-label{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#C8B84A;opacity:0.75;margin-bottom:3px}
.inject-feed-section{background:var(--page-surface);border:1px solid #C8B84A;border-radius:3px;margin-bottom:1rem;overflow:hidden}
.inject-feed-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(122,106,42,0.18);border-bottom:1px solid #C8B84A}
.inject-feed-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#C8B84A}
.inject-feed-body{padding:14px}
.inject-feed-empty{font-size:12px;color:var(--page-text-muted);font-style:italic}
.inject-pill{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:rgba(122,106,42,0.25);color:#C8B84A;border:1px solid rgba(200,184,74,0.4);margin-left:8px}
.doc-repo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.doc-repo-meta{font-size:11px;color:var(--page-text-muted);letter-spacing:0.04em}
.doc-search-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.doc-search-bar input{flex:1;font-size:13px;border:1px solid var(--input-border);border-radius:3px;padding:7px 10px;background:var(--input-bg);color:var(--page-text);font-family:inherit}
.doc-search-bar input:focus{outline:2px solid var(--page-accent);outline-offset:1px}
.doc-filter-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.doc-filter-btn{font-size:11px;padding:4px 10px;border:1px solid var(--page-border);border-radius:2px;background:var(--btn-surface);color:var(--page-text-muted);cursor:pointer;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-family:inherit}
.doc-filter-btn:hover,.doc-filter-btn.active{background:var(--page-surface2);color:var(--page-text);border-color:var(--page-accent)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.doc-card{background:var(--page-surface);border:1px solid var(--page-border);border-radius:3px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;text-decoration:none;color:inherit;transition:border-color 0.15s,background 0.15s}
.doc-card:hover{border-color:var(--page-accent);background:var(--page-surface2)}
.doc-icon{font-size:22px;line-height:1;flex-shrink:0;margin-top:2px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:700;color:var(--page-text);word-break:break-word;line-height:1.3;margin-bottom:3px}
.doc-meta{font-size:10px;color:var(--page-text-muted);letter-spacing:0.04em;text-transform:uppercase}
.doc-type-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:2px 6px;border-radius:2px;margin-right:6px}
.doc-type-badge.pdf{background:rgba(192,74,74,0.2);color:#C04A4A;border:1px solid rgba(192,74,74,0.3)}
.doc-type-badge.doc,.doc-type-badge.docx{background:rgba(74,138,192,0.2);color:#4A8AC0;border:1px solid rgba(74,138,192,0.3)}
.doc-type-badge.ppt,.doc-type-badge.pptx{background:rgba(192,120,74,0.2);color:#C07A4A;border:1px solid rgba(192,120,74,0.3)}
.doc-type-badge.xls,.doc-type-badge.xlsx{background:rgba(74,192,120,0.2);color:#3A9A60;border:1px solid rgba(74,192,120,0.3)}
.doc-type-badge.txt,.doc-type-badge.md{background:rgba(122,106,42,0.2);color:#C8B84A;border:1px solid rgba(122,106,42,0.3)}
.doc-type-badge.other{background:var(--page-surface2);color:var(--page-text-muted);border:1px solid var(--page-border)}
.doc-empty{text-align:center;padding:3rem 1rem;color:var(--page-text-muted)}
.doc-empty .de-icon{font-size:32px;margin-bottom:12px}
.doc-empty .de-title{font-size:13px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:6px}
.doc-empty .de-sub{font-size:12px;line-height:1.6}
.doc-loading{text-align:center;padding:2rem;color:var(--page-text-muted);font-size:12px;letter-spacing:0.05em}
.doc-error{background:rgba(192,74,74,0.12);border:1px solid rgba(192,74,74,0.3);border-radius:3px;padding:12px 14px;font-size:12px;color:#C04A4A;line-height:1.6}
.doc-refresh-btn{font-size:11px;padding:5px 12px;border:1px solid var(--page-border);border-radius:3px;background:var(--btn-surface);color:var(--page-text-muted);cursor:pointer;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-family:inherit}
.doc-refresh-btn:hover{background:var(--btn-hover);color:var(--page-text)}
.doc-repo-note{font-size:11px;color:var(--page-text-muted);line-height:1.5;margin-top:1rem;padding:8px 12px;border:1px solid var(--page-border);border-radius:3px;background:var(--page-surface2)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.adj-label{font-size:10px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px;display:block}
.field input,.field select,.field textarea,.adj-input{font-size:13px;border:1px solid var(--input-border);border-radius:3px;padding:7px 10px;background:var(--input-bg);color:var(--page-text);width:100%;font-family:inherit}
.field textarea,.adj-input{resize:vertical;min-height:56px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.adj-input:focus{outline:2px solid var(--page-accent);outline-offset:1px;border-color:var(--page-accent)}
.auto-pop{color:var(--page-text-muted)!important;background:var(--page-surface2)!important}
.adj-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry-row{display:grid;gap:10px;margin-bottom:10px;align-items:start}
.entry-row.collections-row{grid-template-columns:1.2fr 1fr 1fr 2fr 28px}
.entry-row.maneuver-row{grid-template-columns:1fr 1fr 1.4fr 1.8fr 28px}
.entry-row.fires-row{grid-template-columns:1fr 1fr 1fr 1.4fr 1.2fr 28px}
.col-head{font-size:10px;color:var(--page-text-muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding-bottom:4px}
.add-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--page-text-muted);background:none;border:1px dashed var(--page-border);border-radius:3px;padding:5px 12px;cursor:pointer;margin-top:4px;letter-spacing:0.03em;font-family:inherit}
.add-btn:hover{background:var(--btn-surface);color:var(--page-text)}

.turn0-banner{background:rgba(122,106,42,0.15);border:1px solid #C8B84A;border-radius:3px;padding:12px 16px;margin-bottom:1rem;font-size:13px;color:#C8B84A;line-height:1.6}
.turn0-banner strong{text-transform:uppercase;letter-spacing:0.05em}
.conn-warn{background:rgba(192,74,74,0.12);border:1px solid #C04A4A;border-radius:3px;padding:8px 14px;font-size:12px;color:#C04A4A;margin-bottom:1rem;display:none}
.conn-warn.visible{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="ls-title">Connecting to Firebase…</div>
    <div class="ls-sub" id="ls-sub">Loading game state</div>
  </div>
</div>

<script type="module">
import { initializeApp }      from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, serverTimestamp }
                               from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

// ─────────────────────────────────────────────
// FIREBASE
// ─────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyBdKRyZWpmr0YgZhrwI97WSH5ZG0ER_bAg",
  authDomain:        "amwc-wargame.firebaseapp.com",
  databaseURL:       "https://amwc-wargame-default-rtdb.firebaseio.com",
  projectId:         "amwc-wargame",
  storageBucket:     "amwc-wargame.firebasestorage.app",
  messagingSenderId: "1044419739959",
  appId:             "1:1044419739959:web:486d7dbc673b5cb5ebdab2"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);

// ─────────────────────────────────────────────
// GAME ID  — read from ?game= URL param, fallback to 'default'
// All Firebase reads/writes are scoped under games/<GAME_ID>/
// This isolates simultaneous games from each other in the same database.
// ─────────────────────────────────────────────
const _gameParams = new URLSearchParams(location.search);
const GAME_ID = (_gameParams.get('game') || 'default').toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 40);

// Register this game in the live-index so the Master Director view can find it
// Uses serverTimestamp so the dashboard knows when it was last active
const _liveRef = ref(db, `_live/${GAME_ID}`);
set(_liveRef, { gameId: GAME_ID, lastSeen: Date.now(), active: true });

// Thin helpers — all scoped to this game's namespace
const gRef  = path => ref(db, path ? `games/${GAME_ID}/${path}` : `games/${GAME_ID}`);
const dbSet = async (path, val) => set(gRef(path), val);
const dbGet = async path => { const s = await get(gRef(path)); return s.exists() ? s.val() : null; };
const dbDel = async path => remove(gRef(path));
// onValue wrapper — returns unsubscribe fn
const dbOn  = (path, cb) => { const u = onValue(gRef(path), s => cb(s.exists() ? s.val() : null)); return u; };

// ─────────────────────────────────────────────
// ROLE
// ─────────────────────────────────────────────
// Path-based role detection: /red → red, /blue → blue, /references → director
// Falls back to ?role= param, then defaults to director
const _path = location.pathname.replace(/\/+$/, '').toLowerCase();
const _pathRole = _path.endsWith('/red') ? 'red'
                : _path.endsWith('/blue') ? 'blue'
                : _path.endsWith('/references') ? 'director'
                : null;
const ROLE = _pathRole || _gameParams.get('role') || 'director';
document.body.classList.add('role-' + ROLE);
const _gameLabel = GAME_ID !== 'default' ? ` · ${GAME_ID.toUpperCase()}` : '';
document.title = ROLE === 'director' ? `Director's Table${_gameLabel}`
               : ROLE === 'blue'     ? `Blue Force${_gameLabel}` : `Red Force${_gameLabel}`;

// Keep the live-index heartbeat fresh on any user interaction (throttled)
let _heartbeatThrottle = 0;
document.addEventListener('click', () => {
  const now = Date.now();
  if (now - _heartbeatThrottle > 30000) {
    _heartbeatThrottle = now;
    set(_liveRef, { gameId: GAME_ID, lastSeen: now, active: true, role: ROLE });
  }
});

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const MAN_ACTIONS  = ['Move to','Occupy','Hold','Withdraw','Attack','Defend','Bypass','Screen','Support by fire','On order'];
const EFFECTS      = ['Suppress','Destroy','Neutralize','Obscure','Illuminate','Interdict'];
const BOX_SIZES    = ['1 x 1km','2 x 2km','4 x 4km','6 x 6km','8 x 8km','Custom'];
const SEED_BLUE    = [{unit:'Co A (-)'},{unit:'Co B (-)'},{unit:'Co C (-)'},{unit:'Wpns Co / CAAT'}];
const SEED_RED     = [{unit:'1st Mech Co'},{unit:'2nd Mech Co'},{unit:'Assault Gun Co'},{unit:'Firepower Co'}];
const INJECT_TYPES = ['Intelligence update','Early contact — mid-turn','Weather / environment change','Higher HQ order','Asset availability change','Force structure change','Other'];
const GH_OWNER = 'dkitchens444', GH_REPO = 'amwc-wargame';
// Each role has its own folder plus a shared folder
// Blue/Red see shared + their own subfolder.
// Director uses the GitHub tree API to recursively list all files under /references.
const GH_PATH_MAP = {
  blue: ['references', 'references/blue', 'docs'],
  red:  ['references', 'references/red',  'docs'],
};
const FILE_ICONS   = {pdf:'📄',doc:'📝',docx:'📝',ppt:'📊',pptx:'📊',xls:'📋',xlsx:'📋',txt:'📃',md:'📃',png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',zip:'🗜'};
const SKIP_EXT     = new Set(['html','htm','js','css','json','gitignore','xml','yaml','yml']);

// ─────────────────────────────────────────────
// SHARED STATE  (single source of truth — always reflects Firebase)
// ─────────────────────────────────────────────
const S = {
  gameTime:      'D-0 / 0600L',
  turn:          0,
  blueSubmit:    null,
  redSubmit:     null,
  blueFb:        null,
  redFb:         null,
  injectLog:     {},
  history:       {},
  timerDisplay:  '15:00',
  gameEnded:     null,
  aarNote:       '',
  historyLocked: false,
};

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mkSel = (opts, ph, val='') => {
  let s = `<select><option value="" disabled ${val?'':'selected'}>${ph}</option>`;
  opts.forEach(o => s += `<option${o===val?' selected':''}>${o}</option>`);
  return s + '</select>';
};
const fExt  = n => { const p = n.split('.'); return p.length>1 ? p[p.length-1].toLowerCase() : ''; };
const fIcon = n => FILE_ICONS[fExt(n)] || '📁';
const fSize = b => !b?'': b<1024?b+'B': b<1048576?(b/1024).toFixed(0)+'KB':(b/1048576).toFixed(1)+'MB';
const vEl   = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const parseGT = s => {
  // Supports D+N and D-N notation
  const m = s.match(/D([+-])(\d+)\s*\/\s*(\d{1,2})(\d{2})L?/i);
  if(m) return { sign:m[1], day:+m[2], hour:+m[3], min:+m[4] };
  return null;
};
const fmtGT = (sign, d, h, m) => `D${sign}${d} / ${pad(h)}${pad(m)}L`;
const injectArr = () => Object.values(S.injectLog||{}).sort((a,b)=>a.id-b.id);
const injectsForTeam = t => injectArr().filter(i =>
  i.recipients==='Both teams' ||
  (i.recipients==='Blue only' && t==='blue') ||
  (i.recipients==='Red only'  && t==='red'));

// ─────────────────────────────────────────────
// SYNC DOT
// ─────────────────────────────────────────────
function setSyncDot(state) { // 'live' | 'off' | 'connecting'
  document.querySelectorAll('.sync-dot').forEach(d => {
    d.className = 'sync-dot ' + state;
    d.title = state==='live'?'Connected to Firebase':state==='connecting'?'Reconnecting…':'Disconnected';
  });
}

// ─────────────────────────────────────────────
// CONNECTION MONITOR  (.info/connected)
// ─────────────────────────────────────────────
let _disconnectTimer = null;
let _wasEverConnected = false;

onValue(ref(db, '.info/connected'), snap => {
  const connected = snap.val() === true;
  if (connected) {
    _wasEverConnected = true;
    if (_disconnectTimer) { clearTimeout(_disconnectTimer); _disconnectTimer = null; }
    setSyncDot('live');
    const w = document.getElementById('conn-warn');
    if (w) { w.textContent = ''; w.classList.remove('visible'); }
  } else {
    setSyncDot(_wasEverConnected ? 'off' : 'connecting');
    const w = document.getElementById('conn-warn');
    if (w) {
      w.textContent = _wasEverConnected
        ? '⚠ Firebase connection lost — will reload in 8s to reconnect. Or manually reload now.'
        : '⚠ Connecting to Firebase…';
      w.classList.add('visible');
    }
    if (!_disconnectTimer) {
      _disconnectTimer = setTimeout(() => {
        if (_wasEverConnected) location.reload();
      }, 8000);
    }
  }
});

// ─────────────────────────────────────────────
// TIMER  (director-local; display pushed to Firebase)
// ─────────────────────────────────────────────
let timerSec = 900, timerRunning = false, timerInterval = null;

window.startTimer = () => {
  if (timerRunning) {
    clearInterval(timerInterval); timerRunning = false;
    const b = document.getElementById('timer-btn'); if(b) b.textContent = 'Start';
  } else {
    timerRunning = true;
    const b = document.getElementById('timer-btn'); if(b) b.textContent = 'Pause';
    timerInterval = setInterval(() => {
      timerSec = Math.max(0, timerSec - 1);
      const d = pad(Math.floor(timerSec/60)) + ':' + pad(timerSec%60);
      const e = document.getElementById('turn-timer'); if(e) e.textContent = d;
      dbSet('timerDisplay', d);
      if (timerSec === 0) {
        clearInterval(timerInterval); timerRunning = false;
        if(b) b.textContent = 'Start';
        if(e) e.style.color = '#C04A4A';
      }
    }, 1000);
  }
};

window.resetTimer = () => {
  clearInterval(timerInterval); timerRunning = false;
  const mins = parseInt(document.getElementById('timer-dur-input')?.value) || 15;
  timerSec = mins * 60;
  const d = pad(mins) + ':00';
  const e = document.getElementById('turn-timer');
  if(e) { e.textContent = d; e.style.color = ''; }
  const b = document.getElementById('timer-btn'); if(b) b.textContent = 'Start';
  dbSet('timerDisplay', d);
};

window.updateTimerDur = () => {
  const mins = parseInt(document.getElementById('timer-dur-input').value) || 15;
  if (!timerRunning) {
    timerSec = mins * 60;
    const d = pad(mins) + ':00';
    const e = document.getElementById('turn-timer');
    if(e) { e.textContent = d; e.style.color = ''; }
    dbSet('timerDisplay', d);
  }
};

window.setGameTime = async () => {
  const val = document.getElementById('game-time-input').value.trim(); if(!val) return;
  const p = parseGT(val); if(!p) return;
  await dbSet('gameTime', fmtGT(p.sign||'+', p.day, p.hour, p.min));
  document.getElementById('game-time-input').value = '';
};

window.advanceGameTime = async (dir=1) => {
  const p = parseGT(S.gameTime) || {sign:'-', day:0, hour:6, min:0};
  const hrs = (parseInt(document.getElementById('advance-hrs').value) || 6) * dir;
  // Convert to total signed hours for arithmetic
  const sign = p.sign || '+';
  let totalHrs = (sign==='-' ? -1 : 1) * (p.day * 24 + p.hour) + hrs;
  // Convert back to D+/D- notation
  const newSign = totalHrs < 0 ? '-' : '+';
  totalHrs = Math.abs(totalHrs);
  const newDay  = Math.floor(totalHrs / 24);
  const newHour = Math.floor(totalHrs % 24);
  await dbSet('gameTime', fmtGT(newSign, newDay, newHour, p.min));
};

// ─────────────────────────────────────────────
// INJECT CARD RENDERER
// ─────────────────────────────────────────────
function renderInjectCard(inj) {
  const st = inj.struct
    ? `<div class="inject-entry-struct"><div class="inject-entry-struct-label">Structural change</div>${esc(inj.struct)}</div>` : '';
  return `<div class="inject-entry">
    <div class="inject-entry-header">
      <span class="inject-entry-label">⚡ Director Inject — ${esc(inj.type||'Note')}</span>
      <span class="inject-entry-meta">Turn ${inj.turn} · ${esc(inj.gameTime)} · ${esc(inj.recipients)} · ${new Date(inj.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div class="inject-entry-note">${esc(inj.note).replace(/\n/g,'<br>')}</div>${st}
  </div>`;
}

// ─────────────────────────────────────────────
// BOOT  — fetch ALL state in ONE round-trip, then render, then attach live listeners
// ─────────────────────────────────────────────
async function boot() {
  setSyncDot('connecting');
  const sub = document.getElementById('ls-sub');
  if(sub) sub.textContent = 'Loading game state…';

  // One get() fetches the entire game node at once — single network round-trip
  let snap;
  try {
    snap = await Promise.race([
      dbGet(''),            // fetch entire game/ node
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
    ]);
  } catch(e) {
    // Timeout or network error — render with defaults and warn
    console.warn('Firebase initial fetch failed:', e.message);
    snap = null;
  }

  // Populate S from snapshot (or keep defaults if null)
  if (snap) {
    S.gameTime      = snap.gameTime      ?? S.gameTime;
    S.turn          = snap.turn          ?? S.turn;
    S.blueSubmit    = snap.blueSubmit    ?? null;
    S.redSubmit     = snap.redSubmit     ?? null;
    S.blueFb        = snap.blueFb        ?? null;
    S.redFb         = snap.redFb         ?? null;
    S.injectLog     = snap.injectLog     ?? {};
    S.timerDisplay  = snap.timerDisplay  ?? S.timerDisplay;
    if (snap.meta) {
      S.history       = snap.meta.history       ?? {};
      S.gameEnded     = snap.meta.gameEnded      ?? null;
      S.aarNote       = snap.meta.aarNote        ?? '';
      S.historyLocked = snap.meta.historyLocked  ?? false;
    }
  }

  // Render UI immediately with loaded state
  if (ROLE === 'director') renderDirector();
  else                     renderTeam(ROLE);

  setSyncDot('live');

  // Now attach targeted live listeners — each updates only its own slice of S
  // and re-renders only the affected component

  dbOn('gameTime', val => {
    S.gameTime = val || 'D-0 / 0600L';
    document.querySelectorAll('#game-clock,#team-gametime').forEach(e => { if(e && !e._ended) e.textContent = S.gameTime; });
    // Update game-time display in open turn cards
    // Update next-turn labels on director panels
  });

  dbOn('turn', val => {
    const prev = S.turn;
    S.turn = val ?? 0;
    document.querySelectorAll('#turn-disp,#team-turn').forEach(e => { if(e) e.textContent = S.turn; });
    if (S.turn !== prev) {
      if (ROLE === 'director') {
        // Clear the stable panels so they rebuild for the new turn
        // (wipes adjudication textareas — correct, new turn = fresh adjudication)
        const pb = document.getElementById('panel-blue');
        const pr = document.getElementById('panel-red');
        if (pb) pb.innerHTML = '';
        if (pr) pr.innerHTML = '';
        dirRenderTeamPanel('blue');
        dirRenderTeamPanel('red');
      }
      if (ROLE === 'blue') { teamRenderFeedback('blue'); teamRenderTurnCard('blue'); }
      if (ROLE === 'red')  { teamRenderFeedback('red');  teamRenderTurnCard('red');  }
    }
  });

  dbOn('timerDisplay', val => {
    S.timerDisplay = val || '15:00';
    // Only update display if local timer isn't running (director controls it locally)
    if (!timerRunning) {
      document.querySelectorAll('#turn-timer,#team-timer').forEach(e => { if(e) e.textContent = S.timerDisplay; });
    }
  });

  dbOn('blueSubmit', val => {
    S.blueSubmit = val;
    if (ROLE === 'director') {
      // If panel not yet rendered, do full render; otherwise just update zone
      const el = document.getElementById('panel-blue');
      if (el && el.querySelector('.dir-adj-form')) {
        dirUpdateSubmissionZone('blue');
        dirRenderBadges();
      } else {
        dirRenderTeamPanel('blue');
      }
    }
    if (ROLE === 'blue') teamRenderTurnCard('blue');
  });

  dbOn('redSubmit', val => {
    S.redSubmit = val;
    if (ROLE === 'director') {
      const el = document.getElementById('panel-red');
      if (el && el.querySelector('.dir-adj-form')) {
        dirUpdateSubmissionZone('red');
        dirRenderBadges();
      } else {
        dirRenderTeamPanel('red');
      }
    }
    if (ROLE === 'red') teamRenderTurnCard('red');
  });

  dbOn('blueFb', val => {
    S.blueFb = val;
    // Director: only update the pre-fill values in the adjudication textareas
    // if the panel is already rendered (don't full re-render)
    if (ROLE === 'director') dirSyncFbToTextareas('blue');
    if (ROLE === 'blue')     teamRenderFeedback('blue');
  });

  dbOn('redFb', val => {
    S.redFb = val;
    if (ROLE === 'director') dirSyncFbToTextareas('red');
    if (ROLE === 'red')      teamRenderFeedback('red');
  });

  dbOn('injectLog', val => {
    // Filter out the _placeholder key used to keep the node alive
    const raw = val || {};
    delete raw._placeholder;
    S.injectLog = raw;
    dirRenderInjectLogPreview();
    if (ROLE === 'blue') teamRenderFeedback('blue');
    if (ROLE === 'red')  teamRenderFeedback('red');
    // Update history panel if open
    const hp = document.getElementById('panel-history');
    if (hp && hp.classList.contains('active')) dirRenderHistory();
  });

  dbOn('meta', val => {
    const m = val || {};
    const rawHist = m.history ?? {};
    delete rawHist._placeholder;
    S.history = rawHist;
    S.gameEnded     = m.gameEnded     ?? null;
    S.aarNote       = m.aarNote       ?? '';
    S.historyLocked = m.historyLocked ?? false;

    // Team: ended banner
    const banner = document.getElementById('team-ended-banner');
    if (banner) banner.classList.toggle('visible', !!(S.gameEnded?.ended));
    if (S.gameEnded?.ended) {
      const sub = document.getElementById('team-ended-sub');
      if(sub) sub.textContent = `End of game called at ${S.gameEnded.time}. Submit final tasks and report to Director's Table.`;
    }

    // Director: game-clock ended state
    if (S.gameEnded?.ended) {
      const gc = document.getElementById('game-clock');
      if(gc && !gc._ended) { gc.textContent = S.gameEnded.time + ' — END'; gc.style.color = '#C04A4A'; gc._ended = true; }
    }

    // History panel if open
    const hp = document.getElementById('panel-history');
    if (hp && hp.classList.contains('active')) dirRenderHistory();

    dirRenderBadges();
  });
}

// Kick off boot
boot();

function dirUpdateSubmissionZone(team) {

  const hasNew = sub && sub.turn === S.turn;

  // Update submission display zone
  const zone = document.getElementById('sub-zone-'+team); if(!zone) return;

  const subRows = rows => {
    if (!rows||!rows.length) return '<div class="no-submission">No entries.</div>';
    return rows.map(r => `<div class="sub-row">${r.map(c=>`<span>${esc(c||'—')}</span>`).join('')}</div>`).join('');

  const subRowsFires = rows => {

    return rows.map(r => `<div class="sub-row fires-sub-row">${r.map(c=>`<span title="${esc(c||'—')}">${esc(c||'—')}</span>`).join('')}</div>`).join('');

  const firesRows = subRowsFires((sub.fires||[]).map(f=>[f.asset,f.grid,f.desc,f.effect,f.timing]));

// Sync adjudication textareas from Firebase WITHOUT rebuilding the DOM
// Only syncs if the saved feedback is for the CURRENT turn (prevents stale data
// from a previous turn pre-filling the new turn's adjudication fields).
function dirSyncFbToTextareas(team) {
  const fb = team==='blue' ? S.blueFb : S.redFb; if(!fb) return;
  // Only sync if this feedback is for the current turn
  if (fb.turn !== S.turn) return;
  const fields = {
    ['fb-'+team+'-coll']:    fb.collections||'',
    ['fb-'+team+'-manmov']:  fb.manMov||'',
    ['fb-'+team+'-manbda']:  fb.manBDA||'',
    ['fb-'+team+'-fireres']: fb.fireRes||'',
    ['fb-'+team+'-firestat']:fb.fireStat||'',
    ['fb-'+team+'-dirnote']: fb.dirNote||'',
  };
  Object.entries(fields).forEach(([id, val]) => {
    const el = document.getElementById(id);
    // Only fill empty fields — never overwrite text the director is actively typing
    if (el && !el.value) el.value = val;
  });
}



const buildFb = team => ({
  turn: S.turn, nextTime: S.gameTime, gameTime: S.gameTime,
  collections: vEl('fb-'+team+'-coll'),
  manMov:      vEl('fb-'+team+'-manmov'),
  manBDA:      vEl('fb-'+team+'-manbda'),
  fireRes:     vEl('fb-'+team+'-fireres'),
  fireStat:    vEl('fb-'+team+'-firestat'),
  dirNote:     vEl('fb-'+team+'-dirnote'),
});



window.dirClearAdj = team => {
  ['coll','manmov','manbda','fireres','firestat'].forEach(field => {
    const e = document.getElementById('fb-'+team+'-'+field); if(e) e.value = '';
  });
};

window.dirClearNote = team => {
  const e = document.getElementById('fb-'+team+'-dirnote'); if(e) e.value = '';
};

window.dirPushResults = async team => {
  const fb  = buildFb(team);
  const sub = team==='blue' ? S.blueSubmit : S.redSubmit;

  // Submission is already in history from tcSubmit (Option A).
  // Here we only need to add the adjudication feedback on top.
  // Pull existing history entry — it should already have the submission.
  const he = S.history[S.turn] || {turn:S.turn, blue:null, red:null, blueFb:null, redFb:null};
  // If somehow submission isn't in history yet (edge case), add it now
  if (sub && !sub._cleared && !he[team]) {
    he[team] = JSON.parse(JSON.stringify(sub));
  }
  he[team + 'Fb'] = JSON.parse(JSON.stringify(fb));
  await dbSet('meta/history/' + S.turn, he);

  // Push feedback to team
  await dbSet(team+'Fb', fb);

  // Mark submission cleared with sentinel (never set to null — destabilizes listeners)
  await dbSet(team+'Submit', { _cleared: true, turn: S.turn, at: new Date().toISOString() });

  const s = document.getElementById('status-'+team);
  if(s) { s.textContent=`Results pushed to ${team==='blue'?'Blue':'Red'} — Turn ${S.turn}.`; s.className='status-msg visible ok'; }
  resetTimer();
};

window.pushInject = async () => {
  const note   = document.getElementById('inject-note').value.trim();
  if(!note) {
    const s = document.getElementById('status-inject');
    s.textContent='Director note is required.'; s.className='status-msg visible warn'; return;
  }
  const struct = document.getElementById('inject-struct').value.trim();
  const rcpt   = document.getElementById('inject-recipients').value;
  const type   = document.getElementById('inject-type').value;
  const id     = Date.now();

  await dbSet('injectLog/'+id, {id, at:new Date().toISOString(), gameTime:S.gameTime, turn:S.turn, recipients:rcpt, type, note, struct});

  // Append a short notice to dirNote so teams see it immediately in feedback
  const notice = `[INJECT — ${type} — ${S.gameTime}] ${note}${struct?'\n\nStructural change: '+struct:''}`;
  async function applyToFb(fbKey) {
    const ex = (fbKey==='blueFb'?S.blueFb:S.redFb) ||
               {turn:S.turn,gameTime:S.gameTime,nextTime:S.gameTime,collections:'',manMov:'',manBDA:'',fireRes:'',fireStat:'',dirNote:''};
    ex.dirNote = (ex.dirNote ? ex.dirNote+'\n\n' : '') + notice;
    await dbSet(fbKey, ex);
  }
  if(rcpt==='Both teams'||rcpt==='Blue only') await applyToFb('blueFb');
  if(rcpt==='Both teams'||rcpt==='Red only')  await applyToFb('redFb');

  const s = document.getElementById('status-inject');
  s.textContent=`Inject pushed to ${rcpt} — Turn ${S.turn} / ${S.gameTime}.`; s.className='status-msg visible ok';
  document.getElementById('inject-note').value='';
  document.getElementById('inject-struct').value='';
};

  const log = injectArr();

function dirRenderHistory() {
  const el = document.getElementById('panel-history'); if(!el) return;
  const hist    = Object.values(S.history||{}).sort((a,b)=>a.turn-b.turn);
  const injects = injectArr();
  if (!hist.length && !injects.length) {
    el.innerHTML=`<div class="awaiting-feedback"><div class="aw-title">No turn history yet</div><div class="aw-sub">Completed turns appear here after results are pushed.</div></div>`;
    return;
  }
  const items = [];
  hist.forEach(h    => items.push({type:'turn',   sortKey:h.turn*1e13, data:h}));
  injects.forEach(i => items.push({type:'inject', sortKey:i.id,        inj:i}));
  items.sort((a,b)=>b.sortKey-a.sortKey);

  const hdr = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn-secondary" onclick="clearHistory()">Clear history &amp; inject log</button></div>`;

  const body = items.map(item => {
    if(item.type==='inject') {
      return `<div class="history-inject-block">
        <div class="history-inject-block-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span style="display:flex;align-items:center;gap:8px"><span class="inject-pill">⚡ Inject</span><span class="phase-title" style="font-size:11px">${esc(item.inj.type||'Note')}</span></span>
          <span class="section-tag" style="font-size:11px">Turn ${item.inj.turn} · ${esc(item.inj.gameTime)} · ${esc(item.inj.recipients)}</span>
        </div>
        <div class="history-inject-block-body">${renderInjectCard(item.inj)}</div>
      </div>`;
    }
    const h  = item.data;
    const br = h.blue ? renderHistRows(h.blue, h.blueFb) : '<em style="font-size:12px;color:var(--page-text-muted)">No submission recorded.</em>';
    const rr = h.red  ? renderHistRows(h.red,  h.redFb)  : '<em style="font-size:12px;color:var(--page-text-muted)">No submission recorded.</em>';
    const gt = h.blueFb?.gameTime || h.redFb?.gameTime || '';
    return `<div class="history-turn">
      <div class="history-turn-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="phase-title">Turn ${h.turn}${gt?' — '+gt:''}</span>
        <span class="section-tag" style="font-size:11px">click to expand</span>
      </div>
      <div class="history-turn-body">
        <div><span class="history-team-label blue">Blue Force</span><div style="margin-top:6px">${br}</div></div>
        <div style="margin-top:12px"><span class="history-team-label red">Red Force</span><div style="margin-top:6px">${rr}</div></div>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = hdr + body;
}

window.clearHistory = async () => {
  if(!confirm('Clear all turn history and inject log from Firebase?')) return;
  // Overwrite with placeholder — never delete nodes, it destabilizes listeners
  await dbSet('injectLog', { _placeholder: true });
  await dbSet('meta/history', { _placeholder: true });
};

function renderHistRows(sub, fb) {
  let o = '';
  if(sub.collections?.length) o+=`<div class="history-entry"><strong>Collections</strong>${sub.collections.map(c=>[c.asset,c.nai,c.box,c.pir].filter(Boolean).join(' / ')).join(' | ')}</div>`;
  if(sub.maneuver?.length)    o+=`<div class="history-entry"><strong>Maneuver</strong>${sub.maneuver.map(m=>`${m.unit}: ${m.action||'—'} → ${m.dest||'—'}`).join(' | ')}</div>`;
  if(sub.fires?.length)       o+=`<div class="history-entry"><strong>Fires</strong>${sub.fires.map(f=>`${f.asset} on ${f.grid} (${f.effect})`).join(' | ')}</div>`;
  if(sub.cmdNote)             o+=`<div class="history-entry"><strong>Cmd Note</strong>"${esc(sub.cmdNote)}"</div>`;
  if(fb) {
    o += `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--page-border)">`;
    if(fb.collections) o+=`<div class="history-entry"><strong>Adj — Collections</strong>${esc(fb.collections)}</div>`;
    if(fb.manMov)      o+=`<div class="history-entry"><strong>Adj — Maneuver</strong>${esc(fb.manMov)}</div>`;
    if(fb.manBDA)      o+=`<div class="history-entry"><strong>Adj — BDA</strong>${esc(fb.manBDA)}</div>`;
    if(fb.fireRes)     o+=`<div class="history-entry"><strong>Adj — Fires</strong>${esc(fb.fireRes)}</div>`;
    if(fb.dirNote)     o+=`<div class="history-entry"><strong>Dir Note</strong>${esc(fb.dirNote)}</div>`;
    o += `</div>`;
  }
  return o || '<em style="font-size:12px;color:var(--page-text-muted)">Empty submission.</em>';
}

window.togglePhase = id => {
  const el = document.getElementById(id); if(!el) return;
  const btn = el.previousElementSibling?.querySelector('.phase-toggle');
  if(el.style.display==='none') { el.style.display=''; if(btn) btn.textContent='collapse'; }
  else                          { el.style.display='none'; if(btn) btn.textContent='expand'; }
};

window.endGame = async () => {
  if(!confirm('Call end of game? Teams will be notified instantly.')) return;
  const gt = S.gameTime;
  await dbSet('meta/gameEnded', {ended:true, time:gt, at:new Date().toISOString()});
  // Mark game as ended in live index
  set(_liveRef, { gameId: GAME_ID, lastSeen: Date.now(), active: false, ended: true });
  const notice = `[GAME ENDED] End of game called at ${gt}. Submit final tasks and report to Director's Table.`;
  async function applyEnd(fbKey) {
    const ex = (fbKey==='blueFb'?S.blueFb:S.redFb) ||
               {turn:S.turn,gameTime:gt,nextTime:gt,collections:'',manMov:'',manBDA:'',fireRes:'',fireStat:'',dirNote:''};
    ex.dirNote = (ex.dirNote?ex.dirNote+'\n\n':'') + notice;
    await dbSet(fbKey, ex);
  }
  await applyEnd('blueFb'); await applyEnd('redFb');
  const gc = document.getElementById('game-clock');
  if(gc) { gc.textContent=gt+' — END'; gc.style.color='#C04A4A'; gc._ended=true; }
  const s = document.getElementById('status-inject-end');
  if(s) { s.textContent='End of game called. Teams notified.'; s.className='status-msg visible ok'; }
  const ab = document.getElementById('aar-capture-block');
  if(ab) { ab.style.display=''; setTimeout(()=>ab.scrollIntoView({behavior:'smooth',block:'nearest'}),100); }
};

window.submitAAR = async () => {
  const note = document.getElementById('aar-note-input').value.trim();
  if(!note) {
    const s=document.getElementById('status-aar'); s.textContent='Enter at least one debrief point.'; s.className='status-msg visible warn'; return;
  }
  await dbSet('meta/aarNote', note);
  await dbSet('meta/historyLocked', true);
  const s=document.getElementById('status-aar'); s.textContent='AAR note saved. Turn history locked.'; s.className='status-msg visible ok';
  const btn=document.getElementById('dl-pdf-btn'); if(btn) btn.style.display='';
};

window.resetGame = async () => {
  if(!confirm('Reset to Turn 0? Clears ALL Firebase game data. Cannot be undone.')) return;

  // IMPORTANT: never delete the root games/<GAME_ID>/ node — it kills all listeners.
  // Instead, overwrite every key explicitly so the node structure stays intact.
  // Mark as active again in live index
  set(_liveRef, { gameId: GAME_ID, lastSeen: Date.now(), active: true });
  const cleared = { _cleared: true, turn: 0, at: new Date().toISOString() };
  await Promise.all([
    dbSet('turn', 0),
    dbSet('gameTime', 'D-0 / 0600L'),
    dbSet('timerDisplay', '15:00'),
    dbSet('blueSubmit',  cleared),
    dbSet('redSubmit',   cleared),
    dbSet('blueFb',      { turn:0, gameTime:'D-0 / 0600L', nextTime:'D-0 / 0600L',
                           collections:'', manMov:'', manBDA:'', fireRes:'', fireStat:'', dirNote:'' }),
    dbSet('redFb',       { turn:0, gameTime:'D-0 / 0600L', nextTime:'D-0 / 0600L',
                           collections:'', manMov:'', manBDA:'', fireRes:'', fireStat:'', dirNote:'' }),
    dbSet('injectLog',   { _placeholder: true }),
    dbSet('meta',        { gameEnded: null, aarNote: '', historyLocked: false, history: { _placeholder: true } }),
  ]);

  const gc=document.getElementById('game-clock');
  if(gc) { gc.textContent='D-0 / 0600L'; gc.style.color=''; gc._ended=false; }
  const ab=document.getElementById('aar-capture-block'); if(ab) ab.style.display='none';
  const aarInput=document.getElementById('aar-note-input'); if(aarInput) aarInput.value='';
  const dlBtn=document.getElementById('dl-pdf-btn'); if(dlBtn) dlBtn.style.display='none';
  const s=document.getElementById('status-inject-end');
  if(s) { s.textContent='Game reset to Turn 0. All data cleared.'; s.className='status-msg visible warn'; }
  resetTimer();
};

          fbHtml+=`</div>`;
        }
        if(!empty(hfb.dirNote)) fbHtml+=`<div class="director-note" style="margin-top:10px"><div class="director-note-label">Director's note</div>${esc(hfb.dirNote).replace(/\n/g,'<br>')}</div>`;
      }

      return `<div class="history-turn">
        <div class="history-turn-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span class="phase-title">Turn ${h.turn}${gt?' — '+gt:''}</span>
          <span class="section-tag" style="font-size:11px">click to expand</span>
        </div>
        <div class="history-turn-body">
          ${subHtml ? `<div style="margin-bottom:10px"><div class="feedback-label" style="margin-bottom:6px">Your submission</div>${subHtml}</div>` : ''}
          ${fbHtml ? `<div style="padding-top:${subHtml?'10px':'0'};${subHtml?'border-top:1px solid var(--page-border)':''}"><div class="feedback-label" style="margin-bottom:6px">Director feedback</div>${fbHtml}</div>` : ''}
          ${!subHtml && !fbHtml ? '<em style="font-size:12px;color:var(--page-text-muted)">No data recorded for this turn.</em>' : ''}
        </div>
      </div>`;
    }).join('');

    historyHtml = `
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:2px solid var(--page-border)">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--page-text-muted);margin-bottom:1rem">Turn History — Your submissions &amp; feedback</div>
      ${turnBlocks}
    </div>`;
  }

  el.innerHTML = injectHtml + currentHtml + historyHtml;
}

function teamRenderTurnCard(team) {
  const el = document.getElementById('tpanel-turncard'); if(!el) return;
  const rawSub = team==='blue' ? S.blueSubmit : S.redSubmit;
  const sub = (rawSub && !rawSub._cleared) ? rawSub : null;

  // Already submitted this turn — show confirmation state
  if (sub && sub.turn === S.turn) {
    el.innerHTML = `<div class="submitted-confirm">
      <div class="sc-icon">✓</div>
      <div class="sc-title">Turn ${S.turn} submitted</div>
      <div class="sc-sub">Submitted at ${new Date(sub.submittedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${esc(sub.gameTime)}<br>Awaiting director adjudication — check Director Feedback for results.</div>
      <button class="btn-secondary" onclick="teamForceReopenCard('${team}')">Re-open card to make changes</button>
    </div>`;
    return;
  }

  // Pull previous turn data for pre-fill — check live submit first, then history archive
  const seeds = team==='blue' ? SEED_BLUE : SEED_RED;
  let prevSub = (sub && sub.turn === S.turn - 1) ? sub : null;
  if (!prevSub && S.turn > 0) {
    const prevHist = S.history[S.turn - 1];
    if (prevHist && prevHist[team] && !prevHist[team]._cleared) prevSub = prevHist[team];
  }
  const manSource   = (prevSub && prevSub.maneuver)    ? prevSub.maneuver    : seeds.map(s=>({unit:s.unit,pos:'',action:'',dest:''}));
  const collSource  = (prevSub && prevSub.collections)  ? prevSub.collections  : [];
  const firesSource = (prevSub && prevSub.fires)        ? prevSub.fires        : [];

  const firesRowsHtml = S.turn===0 ? '' : (firesSource||[]).map(f => `
    <div class="entry-row fires-row">
      <div class="field"><input type="text" class="fire-asset" value="${esc(f.asset||'')}"></div>
      <div class="field"><input type="text" class="fire-grid"  value="${esc(f.grid||'')}"></div>
      <div class="field"><input type="text" class="fire-desc"  value="${esc(f.desc||'')}"></div>
      <div class="field">${mkSel(EFFECTS,'effect',f.effect||'')}</div>
      <div class="field"><input type="text" class="fire-timing" value="${esc(f.timing||'')}"></div>
      <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>`).join('');

  const t0Banner = S.turn===0
    ? `<div class="turn0-banner" style="margin-bottom:1rem"><strong>Turn 0 — Initial Laydown.</strong> Enter force positions and commander's intent.</div>` : '';

  const manRowsHtml = (manSource||[]).map(m => `
    <div class="entry-row maneuver-row">
      <div class="field"><input type="text" class="man-unit" value="${esc(m.unit||'')}"></div>
      <div class="field"><input type="text" class="man-pos auto-pop" value="${S.turn===0?'':esc(m.dest||m.pos||'')}" placeholder="Grid"></div>
      <div class="field">${mkSel(MAN_ACTIONS,'select action',S.turn===0?'':m.action||'')}</div>
      <div class="field"><input type="text" class="man-dest" placeholder="Grid or named feature — purpose" value=""></div>
      <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>`).join('');

  const collRowsHtml = (collSource||[]).map(c => `
    <div class="entry-row collections-row">
      <div class="field"><input type="text" class="coll-asset" value="${esc(c.asset||'')}"></div>
      <div class="field"><input type="text" class="coll-nai"   value="${esc(c.nai||'')}"></div>
      <div class="field">${mkSel(BOX_SIZES,'select size',c.box||'')}</div>
      <div class="field"><input type="text" class="coll-pir"   value="${esc(c.pir||'')}"></div>
      <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>`).join('');

  el.innerHTML = `${t0Banner}
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="phase-title" style="font-size:13px">Turn Card</span>
      <span style="font-size:11px;font-weight:700;background:var(--page-surface2);color:var(--page-text-muted);padding:3px 10px;border-radius:3px;border:1px solid var(--page-border);letter-spacing:0.04em;text-transform:uppercase">Turn ${S.turn}</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="meta-label">Game time</span>
      <span style="font-size:13px;font-weight:700;color:var(--page-accent);background:var(--page-surface2);border:1px solid var(--page-border);border-radius:3px;padding:5px 10px">${S.gameTime}</span>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Collections</span><span class="section-tag">ISR tasking${S.turn===0?' — enter initial collections tasking':''}</span></div>
    <div class="section-body">
      <div class="entry-row collections-row" style="margin-bottom:4px">
        <div class="col-head">Asset</div><div class="col-head">NAI center grid</div><div class="col-head">Box size</div><div class="col-head">PIR / targeting purpose</div><div></div>
      </div>
      <div id="tc-coll-rows">${collRowsHtml}</div>
      <button class="add-btn" onclick="tcAddRow('coll')">+ add asset</button>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Maneuver</span><span class="section-tag">${S.turn===0?'Enter initial force positions':'Positions carried forward from last turn'}</span></div>
    <div class="section-body">
      <div class="entry-row maneuver-row" style="margin-bottom:4px">
        <div class="col-head">Unit</div><div class="col-head">Current position</div><div class="col-head">Action</div><div class="col-head">Destination / objective</div><div></div>
      </div>
      <div id="tc-man-rows">${manRowsHtml}</div>
      <button class="add-btn" onclick="tcAddRow('man')">+ add unit</button>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Fires</span><span class="section-tag">Fire missions this turn${S.turn===0?' — enter initial fire support plan':''}</span></div>
    <div class="section-body">
      <div class="entry-row fires-row" style="margin-bottom:4px">
        <div class="col-head">Asset</div><div class="col-head">Target grid</div><div class="col-head">Target description</div><div class="col-head">Desired effect</div><div class="col-head">Timing / trigger</div><div></div>
      </div>
      <div id="tc-fires-rows">${firesRowsHtml}</div>
      <button class="add-btn" onclick="tcAddRow('fires')">+ add fire mission</button>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><span class="section-title">Commander's note</span><span class="section-tag">Main effort and key decision this turn</span></div>
    <div class="section-body">
      <div class="field" style="margin:0">
        <textarea id="tc-cmdnote" placeholder="${S.turn===0?'State commander\'s intent and initial scheme of maneuver.':'State the main effort and the decision driving it this turn.'}" style="min-height:72px"></textarea>
      </div>
    </div>
  </div>
  <div class="submit-row">
    <div id="tc-status" class="status-bar"></div>
    <button class="btn-secondary" onclick="tcClearFires()">Clear fires</button>
    <button class="btn-primary" onclick="tcSubmit('${team}')">${S.turn===0?'Submit initial laydown ↗':'Submit to director\'s table ↗'}</button>
  </div>`;
}

window.teamForceReopenCard = async team => {
  if(!confirm('Re-open the turn card? Your previous submission will be cleared so you can resubmit.')) return;
  await dbSet(team+'Submit', { _cleared: true, turn: S.turn, at: new Date().toISOString() });
  teamRenderTurnCard(team);
};

window.tcAddRow = type => {
  if(type==='coll') {
    const d=document.createElement('div'); d.className='entry-row collections-row';
    d.innerHTML=`<div class="field"><input type="text" class="coll-asset" placeholder="RQ-20, MQ-9…"></div><div class="field"><input type="text" class="coll-nai" placeholder="BK 0512 4231"></div><div class="field">${mkSel(BOX_SIZES,'select size')}</div><div class="field"><input type="text" class="coll-pir" placeholder="Confirm enemy axis IVO…"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-coll-rows').appendChild(d);
  } else if(type==='man') {
    const d=document.createElement('div'); d.className='entry-row maneuver-row';
    d.innerHTML=`<div class="field"><input type="text" class="man-unit" placeholder="Unit designation"></div><div class="field"><input type="text" class="man-pos auto-pop" placeholder="Grid"></div><div class="field">${mkSel(MAN_ACTIONS,'select action')}</div><div class="field"><input type="text" class="man-dest" placeholder="Grid or named feature — purpose"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-man-rows').appendChild(d);
  } else {
    const d=document.createElement('div'); d.className='entry-row fires-row';
    d.innerHTML=`<div class="field"><input type="text" class="fire-asset" placeholder="M777, AH-1Z…"></div><div class="field"><input type="text" class="fire-grid" placeholder="BK 0512 4231"></div><div class="field"><input type="text" class="fire-desc" placeholder="Description"></div><div class="field">${mkSel(EFFECTS,'effect')}</div><div class="field"><input type="text" class="fire-timing" placeholder="On order / H+30 / on contact"></div><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
    document.getElementById('tc-fires-rows').appendChild(d);
  }
};

window.tcClearFires = () => { document.getElementById('tc-fires-rows').innerHTML=''; showTcStatus('Fires cleared.','ok'); };

window.tcSubmit = async team => {
  const note = document.getElementById('tc-cmdnote').value.trim();
  if(!note) { showTcStatus("Commander's note is required.", 'warn'); return; }
  const collections = [...document.querySelectorAll('#tc-coll-rows .entry-row')].map(r=>({
    asset:r.querySelector('.coll-asset')?.value||'', nai:r.querySelector('.coll-nai')?.value||'',
    box:r.querySelector('select')?.value||'',        pir:r.querySelector('.coll-pir')?.value||'',
  }));
  const maneuver = [...document.querySelectorAll('#tc-man-rows .entry-row')].map(r=>({
    unit:r.querySelector('.man-unit')?.value||'', pos:r.querySelector('.man-pos')?.value||'',
    action:r.querySelector('select')?.value||'',  dest:r.querySelector('.man-dest')?.value||'',
  }));
  const fires = [...document.querySelectorAll('#tc-fires-rows .entry-row')].map(r=>({
    asset:r.querySelector('.fire-asset')?.value||'', grid:r.querySelector('.fire-grid')?.value||'',
    desc:r.querySelector('.fire-desc')?.value||'',   effect:r.querySelector('select')?.value||'',
    timing:r.querySelector('.fire-timing')?.value||'',
  }));
  const gt = S.gameTime;
  const submission = {turn:S.turn, gameTime:gt, team, collections, maneuver, fires, cmdNote:note, submittedAt:new Date().toISOString()};

  // Write to Firebase submit path (director sees it immediately)
  await dbSet(team+'Submit', submission);

  // Archive to history immediately — ensures the final turn is always captured
  // even if the director never pushes adjudication (e.g. end-of-game verbal brief).
  // If adjudication is pushed later, dirPushResults will add the feedback on top.
  const existing = S.history[S.turn] || {turn:S.turn, blue:null, red:null, blueFb:null, redFb:null};
  // Only overwrite the team's submission slot — preserve the other team's data
  existing[team] = JSON.parse(JSON.stringify(submission));
  await dbSet('meta/history/' + S.turn, existing);

  showTcStatus(`${team==='blue'?'Blue':'Red'} ${S.turn===0?'initial laydown':'turn card'} submitted — ${gt}. Awaiting director's table.`, 'ok');
};

function showTcStatus(msg, type) {
  const el = document.getElementById('tc-status'); if(!el) return;
  el.textContent=msg; el.className='status-bar visible '+(type||'');
}

// ─────────────────────────────────────────────
// DOCUMENT REPOSITORY
// ─────────────────────────────────────────────
async function ghFetch(path) {
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
                          {headers:{Accept:'application/vnd.github.v3+json'}});
  if(res.status===404) return [];
  if(!res.ok) throw new Error(`GitHub API error ${res.status}`);
  const d = await res.json(); return Array.isArray(d)?d:[];
}
// Recursively fetch all files under /references for director using the Git tree API
async function fetchAllDocsDirector() {
  // Get the default branch's tree SHA for the references folder
  const refsUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/git/trees/HEAD:references?recursive=1`;
  let tree;
  try {
    const res = await fetch(refsUrl, {headers:{Accept:'application/vnd.github.v3+json'}});
    if (!res.ok) {
      // HEAD:references may not exist yet — fall back to listing root references/
      return fetchAllDocsByPaths(['references','docs']);
    }
    const data = await res.json();
    tree = data.tree || [];
  } catch(e) {
    return fetchAllDocsByPaths(['references','docs']);
  }
  const results=[], seen=new Set();
  for(const item of tree) {
    if(item.type!=='blob') continue;
    const name = item.path.split('/').pop();
    const ext  = fExt(name);
    if(SKIP_EXT.has(ext)||name.startsWith('.')||seen.has(item.sha)) continue;
    seen.add(item.sha);
    const fullPath = 'references/' + item.path;
    // Build download URL from raw content path
    const downloadUrl = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${fullPath}`;
    const htmlUrl     = `https://github.com/${GH_OWNER}/${GH_REPO}/blob/main/${fullPath}`;
    // Show folder context in display name if in a subfolder
    const displayName = item.path.includes('/') ? item.path : name;
    results.push({name:displayName,ext,size:item.size||0,downloadUrl,htmlUrl});
  }
  results.sort((a,b)=>{ if(a.ext==='pdf'&&b.ext!=='pdf')return -1; if(b.ext==='pdf'&&a.ext!=='pdf')return 1; return a.name.localeCompare(b.name); });
  return results;
}

// Fetch docs from explicit path list (used for blue/red and as fallback)
async function fetchAllDocsByPaths(paths) {
  const results=[], seen=new Set();
  for(const path of paths) {
    let items; try { items=await ghFetch(path); } catch(e) { continue; }
    for(const item of items) {
      if(item.type!=='file') continue;
      const ext=fExt(item.name);
      if(SKIP_EXT.has(ext)||item.name.startsWith('.')||seen.has(item.sha)) continue;
      seen.add(item.sha);
      results.push({name:item.name,ext,size:item.size,downloadUrl:item.download_url,htmlUrl:item.html_url});
    }
  }
  results.sort((a,b)=>{ if(a.ext==='pdf'&&b.ext!=='pdf')return -1; if(b.ext==='pdf'&&a.ext!=='pdf')return 1; return a.name.localeCompare(b.name); });
  return results;
}

async function fetchAllDocs(role) {
  if (role === 'director') return fetchAllDocsDirector();
  const paths = GH_PATH_MAP[role] || ['references','docs'];
  return fetchAllDocsByPaths(paths);
}

window.renderDocRepo = async cid => {
  const el=document.getElementById(cid); if(!el) return;
  el.innerHTML=`
  <div class="doc-repo-header">
    <div><div class="section-title" style="font-size:13px;margin-bottom:4px">Reference Documents</div>
    <div class="doc-repo-meta">GitHub · ${GH_OWNER}/${GH_REPO} · Click to open or download</div></div>
    <button class="doc-refresh-btn" onclick="(()=>{const e=document.getElementById('${cid}');if(e){e._loaded=false;renderDocRepo('${cid}');}})()">↻ Refresh</button>
  </div>
  <div class="doc-search-bar"><input type="text" id="doc-search-${cid}" placeholder="Search documents…" oninput="filterDocs('${cid}')"></div>
  <div class="doc-filter-bar" id="doc-filters-${cid}"></div>
  <div id="doc-list-${cid}" class="doc-loading">Loading documents…</div>
  <div class="doc-repo-note">Click any document to open or download.</div>`;
  try {
    const docs=await fetchAllDocs(ROLE); el._docs=docs;
    const exts=[...new Set(docs.map(d=>d.ext).filter(Boolean))].sort();
    const fb=document.getElementById(`doc-filters-${cid}`);
    if(fb&&exts.length>1) fb.innerHTML=`<button class="doc-filter-btn active" onclick="setDocFilter('${cid}','all',this)">All (${docs.length})</button>`
      +exts.map(ext=>`<button class="doc-filter-btn" onclick="setDocFilter('${cid}','${ext}',this)">${ext.toUpperCase()} (${docs.filter(d=>d.ext===ext).length})</button>`).join('');
    renderDocList(cid,docs);
  } catch(e) {
    document.getElementById(`doc-list-${cid}`).innerHTML=`<div class="doc-error">Could not load from GitHub.<br><br>Error: ${esc(e.message)}<br><br>Confirm the repository is public. GitHub allows 60 unauthenticated API requests/hour.</div>`;
  }
};

function renderDocList(cid, docs) {
  const el=document.getElementById(`doc-list-${cid}`); if(!el) return;
  if(!docs.length) { el.innerHTML=`<div class="doc-empty"><div class="de-icon">📂</div><div class="de-title">No documents found</div><div class="de-sub">Upload reference files to the GitHub repository.</div></div>`; return; }
  el.innerHTML=`<div class="doc-grid">${docs.map(d=>`<a class="doc-card" href="${esc(d.downloadUrl||d.htmlUrl)}" target="_blank" rel="noopener"><div class="doc-icon">${fIcon(d.name)}</div><div class="doc-info"><div class="doc-name">${esc(d.name)}</div><div class="doc-meta"><span class="doc-type-badge ${d.ext||'other'}">${(d.ext||'file').toUpperCase()}</span>${d.size?fSize(d.size):''}</div></div></a>`).join('')}</div>`;
}

window.filterDocs = cid => {
  const el=document.getElementById(cid); if(!el||!el._docs) return;
  const q=(document.getElementById(`doc-search-${cid}`)?.value||'').toLowerCase(), af=el._activeFilter||'all';
  let docs=el._docs; if(af!=='all') docs=docs.filter(d=>d.ext===af); if(q) docs=docs.filter(d=>d.name.toLowerCase().includes(q));
  renderDocList(cid,docs);
};

window.setDocFilter = (cid,ext,btn) => {
  const el=document.getElementById(cid); if(!el) return; el._activeFilter=ext;
  const fb=document.getElementById(`doc-filters-${cid}`);
  if(fb) fb.querySelectorAll('.doc-filter-btn').forEach(b=>b.classList.toggle('active',b===btn));
  filterDocs(cid);
};
