<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Director — Live Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0C08;--bg2:#10130D;--bg3:#161A12;--bg4:#1E2418;
  --border:#222A18;--border2:#2E3A22;
  --text:#B8C8A8;--text2:#7A9068;--text3:#485838;
  --gold:#8A7A2A;--gold-bright:#C8B44A;--gold-dim:#221E08;
  --green:#4A8A3A;--green-bright:#6AB84A;--green-dim:#102808;
  --blue:#3A6A9A;--blue-bright:#5A9ACA;--blue-dim:#0A1E30;
  --red:#8A3A3A;--red-bright:#C05A5A;--red-dim:#200C0C;
  --amber:#8A5A2A;--amber-bright:#C8844A;
  --font:'Courier New',Courier,monospace;
  --radius:3px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);
}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:50px;
  background:var(--bg2);border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.tb-diamond{width:14px;height:14px;background:var(--gold-bright);transform:rotate(45deg);flex-shrink:0}
.tb-title{font-size:11px;letter-spacing:0.2em;font-weight:700;color:var(--gold-bright);text-transform:uppercase}
.tb-badge{
  font-size:9px;letter-spacing:0.15em;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;border:1px solid var(--red-bright);
  color:var(--red-bright);background:var(--red-dim);
}
.topbar-right{display:flex;align-items:center;gap:16px}
.tb-stat{font-size:10px;color:var(--text3);letter-spacing:0.08em}
.tb-stat span{color:var(--text2)}
.tb-clock{font-size:12px;color:var(--text2);letter-spacing:0.06em;font-weight:700}

/* ── CONTROLS BAR ── */
.controls{
  display:flex;align-items:center;gap:12px;padding:10px 24px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.ctrl-label{font-size:10px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap}
.ctrl-input{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:5px 10px;font-family:var(--font);font-size:11px;border-radius:var(--radius);
  outline:none;width:160px;
}
.ctrl-input:focus{border-color:var(--gold)}
.ctrl-select{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:5px 10px;font-family:var(--font);font-size:11px;border-radius:var(--radius);
  outline:none;cursor:pointer;
}
.ctrl-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0}
.stale-note{font-size:10px;color:var(--text3);margin-left:auto}

/* ── MAIN ── */
.page{padding:20px 24px}

/* ── EMPTY STATE ── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:40vh;gap:12px;color:var(--text3);
}
.empty-icon{font-size:36px;opacity:.4}
.empty-title{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.empty-sub{font-size:11px;color:var(--text3);text-align:center;max-width:360px;line-height:1.6}
.pulse-dot{
  width:10px;height:10px;border-radius:50%;background:var(--green-bright);
  box-shadow:0 0 0 0 var(--green-bright);
  animation:pulse-ring 2s ease-out infinite;
}
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(106,184,74,.6)}
  70%{box-shadow:0 0 0 10px rgba(106,184,74,0)}
  100%{box-shadow:0 0 0 0 rgba(106,184,74,0)}
}

/* ── GAME GRID ── */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* ── GAME TILE ── */
.game-tile{
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);
  overflow:hidden;transition:border-color .2s;
  display:flex;flex-direction:column;
}
.game-tile.ended{border-color:var(--border);opacity:.7}
.game-tile:not(.ended):hover{border-color:var(--border2)}

.tile-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px 9px;border-bottom:1px solid var(--border);
  background:var(--bg3);
}
.tile-game-id{font-size:13px;font-weight:700;letter-spacing:0.1em;color:var(--gold-bright);text-transform:uppercase}
.tile-turn{font-size:11px;color:var(--text2);letter-spacing:0.06em}
.tile-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tile-status-dot.live{background:var(--green-bright);box-shadow:0 0 5px var(--green-bright)}
.tile-status-dot.stale{background:var(--amber-bright);box-shadow:0 0 4px var(--amber-bright)}
.tile-status-dot.ended{background:var(--red-bright)}

.tile-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:10px}

.submission-row{display:flex;gap:8px}
.sub-pill{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 6px;border-radius:2px;border:1px solid;
}
.sub-pill.submitted{border-color:var(--green);background:var(--green-dim)}
.sub-pill.pending{border-color:var(--border);background:transparent}
.sub-pill.cleared{border-color:var(--border);background:transparent;opacity:.5}
.sub-pill-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
.sub-pill.submitted .sub-pill-label{color:var(--green-bright)}
.sub-pill.pending   .sub-pill-label{color:var(--text3)}
.sub-pill.cleared   .sub-pill-label{color:var(--text3)}
.sub-pill-status{font-size:10px}
.sub-pill.submitted .sub-pill-status{color:var(--green-bright)}
.sub-pill.pending   .sub-pill-status{color:var(--text3)}

.tile-meta-row{display:flex;justify-content:space-between;align-items:center}
.tile-meta-item{font-size:10px;color:var(--text3);letter-spacing:0.04em}
.tile-meta-item span{color:var(--text2)}
.tile-inject-bar{
  display:flex;align-items:center;gap:6px;
  font-size:10px;color:var(--text3);
}
.inject-count{
  font-size:10px;font-weight:700;padding:1px 7px;border-radius:2px;
  background:var(--gold-dim);color:var(--gold-bright);border:1px solid var(--gold);
}
.inject-count.zero{background:transparent;color:var(--text3);border-color:var(--border)}

.tile-footer{
  padding:8px 14px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.tile-gametime{font-size:11px;color:var(--page-accent,var(--text2));font-weight:700;letter-spacing:0.06em}
.tile-lastactive{font-size:10px;color:var(--text3)}
.tile-ended-badge{
  font-size:9px;letter-spacing:0.12em;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;background:var(--red-dim);color:var(--red-bright);border:1px solid var(--red);
}

.tile-open-link{
  font-size:10px;color:var(--text3);text-decoration:none;letter-spacing:0.06em;
  padding:3px 8px;border:1px solid var(--border);border-radius:2px;
  transition:all .12s;
}
.tile-open-link:hover{border-color:var(--text2);color:var(--text)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="tb-diamond"></div>
    <div class="tb-title">Master Director — Live Dashboard</div>
    <div class="tb-badge">Read Only</div>
  </div>
  <div class="topbar-right">
    <div class="tb-stat">Active: <span id="stat-active">—</span></div>
    <div class="tb-stat">Total: <span id="stat-total">—</span></div>
    <div class="tb-clock" id="real-clock"></div>
  </div>
</div>

<div class="controls">
  <span class="ctrl-label">Filter</span>
  <input class="ctrl-input" id="filter-input" type="text" placeholder="Search game name…" oninput="applyFilters()">
  <span class="ctrl-sep"></span>
  <span class="ctrl-label">Status</span>
  <select class="ctrl-select" id="filter-status" onchange="applyFilters()">
    <option value="all">All games</option>
    <option value="active">Active only</option>
    <option value="ended">Ended only</option>
  </select>
  <span class="ctrl-sep"></span>
  <span class="ctrl-label">Sort</span>
  <select class="ctrl-select" id="sort-by" onchange="applyFilters()">
    <option value="lastSeen">Last active</option>
    <option value="gameId">Game name (A–Z)</option>
    <option value="turn">Turn (high–low)</option>
  </select>
  <span class="stale-note" id="stale-note"></span>
</div>

<div class="page">
  <div id="grid-container">
    <div class="empty-state" id="empty-state">
      <div class="pulse-dot"></div>
      <div class="empty-title">Watching for active games…</div>
      <div class="empty-sub">Games appear here automatically when a Director, Blue, or Red table opens a session. No setup required.</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBdKRyZWpmr0YgZhrwI97WSH5ZG0ER_bAg",
  authDomain:        "amwc-wargame.firebaseapp.com",
  databaseURL:       "https://amwc-wargame-default-rtdb.firebaseio.com",
  projectId:         "amwc-wargame",
  storageBucket:     "amwc-wargame.firebasestorage.app",
  messagingSenderId: "1044419739959",
  appId:             "1:1044419739959:web:486d7dbc673b5cb5ebdab2"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);

// ── State ──
const liveIndex  = {};  // gameId → { gameId, lastSeen, active, ended }
const gameState  = {};  // gameId → snapshot of games/<gameId>
const STALE_MS   = 30 * 60 * 1000;   // 30 min — show as stale
const HIDE_MS    = 4  * 60 * 60 * 1000; // 4 hr — hide entirely

// ── Real-time clock ──
const clockEl = document.getElementById('real-clock');
setInterval(() => {
  if (clockEl) clockEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}, 1000);

// ── Watch _live index ──
onValue(ref(db, '_live'), snap => {
  const val = snap.val() || {};
  Object.entries(val).forEach(([gid, meta]) => {
    liveIndex[gid] = meta;
    // Subscribe to this game's state if not already watching
    if (!gameState[gid]) {
      gameState[gid] = { _loading: true };
      onValue(ref(db, `games/${gid}`), gsnap => {
        gameState[gid] = gsnap.val() || {};
        render();
      });
    }
  });
  render();
});

// ── Render ──
function render() {
  const filterText   = (document.getElementById('filter-input')?.value || '').toLowerCase().trim();
  const filterStatus = document.getElementById('filter-status')?.value || 'all';
  const sortBy       = document.getElementById('sort-by')?.value || 'lastSeen';

  const now = Date.now();

  let entries = Object.entries(liveIndex).map(([gid, meta]) => {
    const gs    = gameState[gid] || {};
    const age   = now - (meta.lastSeen || 0);
    const ended = !!meta.ended || !!(gs.meta?.gameEnded?.ended);
    const stale = !ended && age > STALE_MS;
    const hide  = !ended && age > HIDE_MS;

    const blueRaw = gs.blueSubmit;
    const redRaw  = gs.redSubmit;
    const blueSub = blueRaw && !blueRaw._cleared;
    const redSub  = redRaw  && !redRaw._cleared;
    const injectCount = Object.keys(gs.injectLog || {}).filter(k => k !== '_placeholder').length;

    return { gid, meta, gs, age, ended, stale, hide, blueSub, redSub, injectCount };
  });

  // Apply hide threshold
  entries = entries.filter(e => !e.hide);

  // Filter
  if (filterText) entries = entries.filter(e => e.gid.includes(filterText));
  if (filterStatus === 'active') entries = entries.filter(e => !e.ended);
  if (filterStatus === 'ended')  entries = entries.filter(e =>  e.ended);

  // Sort
  entries.sort((a, b) => {
    if (sortBy === 'lastSeen') return (b.meta.lastSeen||0) - (a.meta.lastSeen||0);
    if (sortBy === 'gameId')   return a.gid.localeCompare(b.gid);
    if (sortBy === 'turn') {
      const ta = a.gs.turn ?? 0, tb = b.gs.turn ?? 0;
      return tb - ta;
    }
    return 0;
  });

  // Stats
  const activeCount = entries.filter(e => !e.ended).length;
  document.getElementById('stat-active').textContent = activeCount;
  document.getElementById('stat-total').textContent  = entries.length;

  const staleCount = entries.filter(e => e.stale).length;
  const staleNote  = document.getElementById('stale-note');
  if (staleNote) staleNote.textContent = staleCount ? `${staleCount} game${staleCount>1?'s':''} showing stale (>30 min inactive)` : '';

  const container = document.getElementById('grid-container');
  const empty     = document.getElementById('empty-state');

  if (!entries.length) {
    container.innerHTML = '';
    if (!empty) {
      container.innerHTML = `<div class="empty-state"><div class="pulse-dot"></div><div class="empty-title">No games match current filters</div><div class="empty-sub">Adjust filters or wait for game sessions to come online.</div></div>`;
    } else {
      container.appendChild(empty);
    }
    return;
  }

  container.innerHTML = `<div class="game-grid">${entries.map(e => renderTile(e)).join('')}</div>`;
}

function renderTile(e) {
  const { gid, gs, ended, stale, blueSub, redSub, injectCount, meta, age } = e;

  const dotClass  = ended ? 'ended' : stale ? 'stale' : 'live';
  const dotTitle  = ended ? 'Game ended' : stale ? 'Inactive >30 min' : 'Active';
  const turn      = gs.turn ?? '—';
  const gameTime  = gs.gameTime ?? '—';

  const blueClass = blueSub ? 'submitted' : (gs.blueSubmit?._cleared ? 'cleared' : 'pending');
  const redClass  = redSub  ? 'submitted' : (gs.redSubmit?._cleared  ? 'cleared' : 'pending');
  const blueLabel = blueSub ? '✓ Submitted' : (gs.blueSubmit?._cleared ? 'Adjudicated' : 'Pending');
  const redLabel  = redSub  ? '✓ Submitted' : (gs.redSubmit?._cleared  ? 'Adjudicated' : 'Pending');

  const lastActiveStr = formatAge(age);

  const baseUrl  = location.href.replace(/dashboard\.html.*$/, '');
  const dirUrl   = `${baseUrl}index.html?game=${gid}&role=director`;

  return `<div class="game-tile${ended?' ended':''}">
    <div class="tile-header">
      <div>
        <div class="tile-game-id">${esc(gid)}</div>
        <div class="tile-turn">Turn ${turn}</div>
      </div>
      <div class="tile-status-dot ${dotClass}" title="${dotTitle}"></div>
    </div>
    <div class="tile-body">
      <div class="submission-row">
        <div class="sub-pill ${blueClass}">
          <span class="sub-pill-label">Blue</span>
          <span class="sub-pill-status">${blueLabel}</span>
        </div>
        <div class="sub-pill ${redClass}">
          <span class="sub-pill-label">Red</span>
          <span class="sub-pill-status">${redLabel}</span>
        </div>
      </div>
      <div class="tile-inject-bar">
        <span class="inject-count${injectCount===0?' zero':''}">⚡ ${injectCount}</span>
        <span>${injectCount === 0 ? 'No injects pushed' : `Inject${injectCount!==1?'s':''} pushed`}</span>
      </div>
    </div>
    <div class="tile-footer">
      <div>
        <div class="tile-gametime">${esc(gameTime)}</div>
        <div class="tile-lastactive">Last active: ${lastActiveStr}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${ended ? '<span class="tile-ended-badge">Ended</span>' : ''}
        <a class="tile-open-link" href="${dirUrl}" target="_blank">Director ↗</a>
      </div>
    </div>
  </div>`;
}

function formatAge(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60)  return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Expose filter/sort to window for onchange handlers
window.applyFilters = render;

// Re-render every 30 seconds to refresh "last active" timestamps
setInterval(render, 30000);
</script>
</body>
</html>
